  /* ---------- расходы у помещений ---------- */
  function rashody() {
    var s = OV.sost;
    if (!s.rezultat) { sl.rashody.innerHTML = ''; return; }
    var h = [], i = 0;
    E.pomescheniya.forEach(function (p) {
      var r = OV.model.rezPom(p.id); if (!r) return;
      var chips = [];
      var estV = OV.model.estVytyazhka(p.id), estP = OV.model.estPritok(p.id);
      if (r.trebuemayaVytyazhka != null ? r.trebuemayaVytyazhka > 0 : estV) chips.push(['В', r.trebuemayaVytyazhka, '#c7791a', '#fff4e6']);
      if (r.trebuemyPritok != null ? r.trebuemyPritok > 0 : estP) chips.push(['П', r.trebuemyPritok, '#2f7fd1', '#eaf3fd']);
      if (!chips.length) return;
      var fs = 0.25, y = p.marka[1] - 0.84;
      var ymin = Math.min.apply(0, p.kontur.map(function (q) { return q[1]; }));
      if (y - 0.2 < ymin + 0.04) y = p.marka[1] + 0.6;
      var tex = chips.map(function (c) { return c[0] + ' ' + (c[1] != null ? OV.chislo(c[1], 0) + ' м³/ч' : (r.normaNet ? 'нормы нет' : '{{L}}')); });
      var ws = tex.map(function (t) { return t.length * fs * 0.56 + 0.2; });
      var total = ws.reduce(function (a, b) { return a + b; }, 0) + (ws.length - 1) * 0.08;
      var x = p.marka[0] - total / 2;
      var gg = '';
      chips.forEach(function (c, k) {
        var ph = c[1] == null;
        gg += '<rect x="' + f(x) + '" y="' + f(-(y + 0.2)) + '" width="' + f(ws[k]) + '" height=".36" rx=".06" fill="' + c[3] + '" stroke="' + c[2] + '" stroke-width="1"' + NSE + (ph ? ' stroke-dasharray="3 2"' : '') + '/>';
        gg += tekst(x + 0.1, y - 0.08, tex[k], fs, '', ' fill="' + c[2] + '" font-weight="600"' + (ph ? ' font-style="italic"' : ''));

      i++;

    sl.rashody.innerHTML = h.join('');

  /* ---------- подсветки ---------- */

  pl.obnovit = function () { klapany(); reshetki(); rashody(); podsvetki(); };
  pl.obnovitPodsvetki = podsvetki;

  /* ---------- вид: преобразование ---------- */
  function primenit() { mir.setAttribute('transform', 'matrix(' + V.s + ',0,0,' + V.s + ',' + V.tx + ',' + V.ty + ')'); }
  function granicyVsego() { var o = E.kontur; return { x1: -4.15, y1: -4.15, x2: o[1][0] + 1.4, y2: o[2][1] + 1.4 }; }
  function celevoyVid(b, opts) {
    opts = opts || {};
    var m = opts.zapas == null ? 24 : opts.zapas;
    var bw = b.x2 - b.x1, bh = b.y2 - b.y1;
    var dw = W * (opts.dolyaW || 1);
    var s = Math.min((dw - 2 * m) / bw, (H - 2 * m) / bh);
    if (opts.maxS) s = Math.min(s, opts.maxS);
    var cxS = W * (opts.centrX == null ? 0.5 : opts.centrX), cyS = H / 2;
    var cx = (b.x1 + b.x2) / 2, cy = (b.y1 + b.y2) / 2;
    return { s: s, tx: cxS - cx * s, ty: cyS + cy * s };
  }
  var animTok = 0;
  function perehod(cel, ms) {
    var tok = ++animTok;
    if (!ms) { V.s = cel.s; V.tx = cel.tx; V.ty = cel.ty; primenit(); return; }
    var s0 = V.s, c0 = { x: (W / 2 - V.tx) / V.s, y: -(H / 2 - V.ty) / V.s };
    var c1 = { x: (W / 2 - cel.tx) / cel.s, y: -(H / 2 - cel.ty) / cel.s };
    var t0 = performance.now();
    (function shag() {
      if (tok !== animTok) return;
      var k = Math.min(1, (performance.now() - t0) / ms);
      var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      var s = s0 * Math.pow(cel.s / s0, e);
      var cx = c0.x + (c1.x - c0.x) * e, cy = c0.y + (c1.y - c0.y) * e;
      V.s = s; V.tx = W / 2 - cx * s; V.ty = H / 2 + cy * s;
      primenit();
      if (k < 1) OV.kadr(shag);
    })();
  }
  pl.vpisat = function (ms) { perehod(celevoyVid(granicyVsego()), ms == null ? 300 : ms); };
  pl.pokazat = function (b, opts) { opts = opts || {}; perehod(celevoyVid(b, opts), opts.ms == null ? 380 : opts.ms); };
  pl.granicy = function (id) {
    var m = OV.model, p = m.pom(id);
    if (p) { var xs = p.kontur.map(function (q) { return q[0]; }), ys = p.kontur.map(function (q) { return q[1]; }); return { x1: Math.min.apply(0, xs), y1: Math.min.apply(0, ys), x2: Math.max.apply(0, xs), y2: Math.max.apply(0, ys) }; }
    var r = m.resh(id);
    if (r) return { x1: r.x - 0.3, y1: r.y - 0.3, x2: r.x + 0.3, y2: r.y + 0.3 };
    var kp = (E.klapany || []).filter(function (x) { return x.id === id; })[0];
    if (kp) { var kx = kp.os === 'h' ? kp.k : kp.c, ky = kp.os === 'h' ? kp.c : kp.k; return { x1: kx - 0.4, y1: ky - 0.4, x2: kx + 0.4, y2: ky + 0.4 }; }
    var d = m.vd(id);
    if (d) { var xs2 = d.tochki.map(function (q) { return q[0]; }), ys2 = d.tochki.map(function (q) { return q[1]; }); return { x1: Math.min.apply(0, xs2), y1: Math.min.apply(0, ys2), x2: Math.max.apply(0, xs2), y2: Math.max.apply(0, ys2) }; }
    return null;
  };
  pl.pokazatElement = function (id, opts) {
    var b = pl.granicy(id); if (!b) return;
    var z = (opts && opts.okrug) || 3.2;
    var cx = (b.x1 + b.x2) / 2, cy = (b.y1 + b.y2) / 2;
    var w = Math.max(b.x2 - b.x1, z * 2), h = Math.max(b.y2 - b.y1, z * 1.3);
    pl.pokazat({ x1: cx - w / 2 - 1, y1: cy - h / 2 - 0.8, x2: cx + w / 2 + 1, y2: cy + h / 2 + 0.8 }, opts);
  };
  pl.razmer = function () {
    if (!vidEl) return;
    var nW = vidEl.clientWidth, nH = vidEl.clientHeight;
    if (!nW || !nH) return;
    // сохранить центр
    var cx = (W / 2 - V.tx) / V.s, cy = -(H / 2 - V.ty) / V.s;
    W = nW; H = nH;
    V.tx = W / 2 - cx * V.s; V.ty = H / 2 + cy * V.s;
    primenit();
  };
  pl.el = function (vid, id) {
    if (vid === 'pom') return svg.querySelector('.pl-hit[data-pom="' + id + '"]');
    if (vid === 'resh') return svg.querySelector('.pl-reshetka[data-resh="' + id + '"]');
    if (vid === 'marka-resh') return svg.querySelector('.pl-marka-r[data-resh="' + id + '"]');
    if (vid === 'vd') return svg.querySelector('.pl-vd[data-vd="' + id + '"]');
    if (vid === 'neraspozn') return svg.querySelectorAll('[data-neraspozn]');
    if (vid === 'kp') return svg.querySelector('.pl-kp[data-kp="' + id + '"]');
    if (vid === 'kp-novye') return svg.querySelectorAll('.pl-kp.nov');
    return null;
  };

  /* ---------- выбор ---------- */
  pl.vybrat = function (v, tiho) {
    OV.sost.vybor = v;
    podsvetki();
    OV.obolochka.obnovitSvoystva();
    OV.obolochka.obnovitParametry();
    OV.obolochka.schetVybora(v ? 1 : 0);
    OV.obolochka.kontekst(v ? ({ pom: 'Пространства', resh: 'Воздухораспределители', vd: 'Воздуховоды' })[v.vid] : null);
    if (!tiho && OV.pult) OV.pult.vyborIzPlana(v);
  };

  function opisanie(t) {
    var m = OV.model;
    var e = t.closest('[data-resh]');
    if (e) { var r = m.resh(e.getAttribute('data-resh')); return { v: { vid: 'resh', id: r.id }, s: 'Воздухораспределители : Решётка вытяжная : ' + m.razmerResh(r.id) + ' : ' + r.id + ' (' + r.sistema + ')' }; }
    e = t.closest('[data-vd]');
    if (e) { var d = m.vd(e.getAttribute('data-vd')); return { v: { vid: 'vd', id: d.id }, s: 'Воздуховоды : Круглый воздуховод : ' + d.razmer + ' : ' + d.sistema }; }
    e = t.closest('[data-pom]');
    if (e) { var p = m.pom(e.getAttribute('data-pom')); return { v: { vid: 'pom', id: p.id }, s: 'Пространства : Пространство : ' + p.id + ' ' + p.imya }; }
    return null;
  }

  /* ---------- события мыши ---------- */
  function lokal(e) {
    var r = svg.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }
  function podklyuchitSobytiya() {
    var sdvig = null, probel = false, nadVidom = false, posledSred = 0, bylSdvig = false;
    vidEl.addEventListener('mouseenter', function () { nadVidom = true; });
    vidEl.addEventListener('mouseleave', function () {
      nadVidom = false;
      if (navodId) { navodId = null; podsvetki(); }
      OV.obolochka.status(null);
    });
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' && nadVidom && !probel) { probel = true; vidEl.classList.add('gotov-sdvig'); e.preventDefault(); }
      if (e.key === 'Escape' && OV.sost.vybor && !document.querySelector('.dlg')) pl.vybrat(null);
    });
    window.addEventListener('keyup', function (e) { if (e.code === 'Space') { probel = false; vidEl.classList.remove('gotov-sdvig'); } });

    svg.addEventListener('wheel', function (e) {
      e.preventDefault();
      animTok++;
      var p = lokal(e);
      var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
      var k = Math.pow(1.0018, -dy);
      k = Math.max(0.5, Math.min(2, k));

  /* ---------- воздуховоды, фасонные части, решётки ---------- */

      koren.add(sistemnyy(truba, sistema, mat.ocink)); meshes.push(truba);

  /* ---------- стояки через 12 этажей, крышные вентиляторы, призрачные этажи ---------- */

  function postroitStoyakiIEtazhi() {

      var kolpak = new T.Mesh(new T.ConeGeometry(0.46, 0.28, 40), mat.ventilyator); kolpak.position.set(sx, yk + 0.94, sz);
      [stakan, korp, kolpak].forEach(function (m) { koren.add(sistemnyy(m, s.sistema, m.material)); meshes.push(m); });

<script>/* src/tour.js */
/* Экскурсия: затемнение с «окнами», кольца подсветки, панель-пояснение, шаги. */
(function () {
  'use strict';
  var OV = window.OV = window.OV || {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return OV.esc(s); };

  /* =================== подсветка (затемнение + кольца) =================== */
  var pod = OV.podsvetka = { dyrki: [], celi: [], zatemnit: false };
  var ZAPAS = 5;

  function pryamougolniki(celi) {
    var r = [];
    if (OV.vid3d && OV.vid3d.otkryt) {   // план скрыт 3D-видом: вместо элементов плана подсвечиваем сам 3D-вид
      var v3 = document.getElementById('vid3d'), bylo = false;
      celi = celi.map(function (c) {
        if (!c) return c;
        var vPlane = function (x) { return x && x.closest && x.closest('#plan'); };
        var est = (c.length !== undefined && !c.getBoundingClientRect) ? Array.prototype.some.call(c, vPlane) : vPlane(c);
        if (!est) return c;
        if (bylo) return null;
        bylo = true; return v3;
      });
    }
    celi.forEach(function (c) {
      if (!c) return;
      if (c.length !== undefined && !c.getBoundingClientRect) { Array.prototype.forEach.call(c, function (x) { var q = OV.obolochka.pryam(x); if (q && q.w > 0) r.push(q); }); return; }
      var q = OV.obolochka.pryam(c);
      if (q && q.w > 0 && q.h > 0) r.push(q);
    });
    return r.map(function (q) {
      var x1 = Math.max(2, q.x - ZAPAS), y1 = Math.max(2, q.y - ZAPAS), x2 = Math.min(1598, q.x + q.w + ZAPAS), y2 = Math.min(898, q.y + q.h + ZAPAS);
      return { x: x1, y: y1, w: Math.max(0, x2 - x1), h: Math.max(0, y2 - y1) };
    });
  }
  function peresek(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }
  function obedinit(rs) {
    var out = rs.slice(), ok = false;
    while (!ok) {
      ok = true;
      for (var i = 0; i < out.length && ok; i++) for (var j = i + 1; j < out.length && ok; j++) {
        if (peresek(out[i], out[j])) {
          var a = out[i], b = out[j];
          var x1 = Math.min(a.x, b.x), y1 = Math.min(a.y, b.y), x2 = Math.max(a.x + a.w, b.x + b.w), y2 = Math.max(a.y + a.h, b.y + b.h);
          out.splice(j, 1); out[i] = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }; ok = false;
        }
      }
    }
    return out;
  }
  function kontur(r) {
    var x = r.x, y = r.y, w = r.w, h = r.h, k = Math.min(7, w / 2, h / 2);
    if (w <= 0 || h <= 0) return '';
    return 'M' + (x + k) + ' ' + y + 'H' + (x + w - k) + 'A' + k + ' ' + k + ' 0 0 1 ' + (x + w) + ' ' + (y + k) + 'V' + (y + h - k) + 'A' + k + ' ' + k + ' 0 0 1 ' + (x + w - k) + ' ' + (y + h) +
      'H' + (x + k) + 'A' + k + ' ' + k + ' 0 0 1 ' + x + ' ' + (y + h - k) + 'V' + (y + k) + 'A' + k + ' ' + k + ' 0 0 1 ' + (x + k) + ' ' + y + 'Z';
  }
  function risovatDyrki(ds) {
    var d = 'M0 0H1600V900H0Z' + ds.map(kontur).join('');
    $('zatemnenie').style.clipPath = 'path(evenodd, "' + d + '")';
  }
  var anim = false, animTok = 0;
  function tvinDyrki(novye, ms) {
    var stare = pod.dyrki.slice();
    var n = Math.max(stare.length, novye.length);
    var a = [], b = [];
    for (var i = 0; i < n; i++) {
      var s = stare[i], t = novye[i];
      if (!s) s = { x: t.x + t.w / 2, y: t.y + t.h / 2, w: 0, h: 0 };
      if (!t) t = { x: s.x + s.w / 2, y: s.y + s.h / 2, w: 0, h: 0 };

  }

    });
  }

    opts = opts || {};

    else { z.classList.remove('vid'); pod.dyrki = []; }

    return rs;
  };
  pod.snyat = function () {

  /* =================== панель-пояснение =================== */
  var pj = OV.poyasnenie = { vidna: false };
  var IKB = {

    kak: '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v2.2M8 12.3v2.2M1.5 8h2.2M12.3 8h2.2M3.4 3.4l1.6 1.6M11 11l1.6 1.6M3.4 12.6 5 11M11 5l1.6-1.6" stroke="currentColor" stroke-width="1.6"/></svg>',
    vyg: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M3 8.3l3.2 3.2L13 4.7" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
  };
  function znacheniya() { return { kolvoPomescheniy: OV.E.pomescheniya.length, kolvoReshetok: OV.E.reshetki.length, kolvoVozd: OV.E.vozduhovody.length }; }

  function html(t, shag) {

      for (var i = 0; i < shag.vsego; i++) toch += '<i class="' + (i === shag.n ? 'akt' : (i < shag.n ? 'bylo' : '')) + '"></i>';

      '<div class="pj-blok kak"><div class="zn">' + IKB.kak + '</div><div><h5>Как это работает внутри</h5><p>' + OV.tekst(t.kak, znacheniya()) + '</p></div></div>' +
      '<div class="pj-blok vyg"><div class="zn">' + IKB.vyg + '</div><div><h5>Выгода для вас</h5><p>' + OV.tekst(t.vygoda, znacheniya()) + '</p></div></div></div>';

    return h;

  /* выбор места для панели рядом с целью, не перекрывая её */
  function mesto(pw, ph, rs, pred) {
    var W = 1600, H = 900, m = 10, g = 16;
    var p = rs[0], vt = rs.slice(1);
    if (!p) return { x: (W - pw) / 2, y: (H - ph) / 2, s: '' };
    var kand = [];
    var ys = [p.y + p.h / 2 - ph / 2, p.y, p.y + p.h - ph, 170, H - ph - m];
    var xs = [p.x + p.w / 2 - pw / 2, p.x, p.x + p.w - pw];

    function ploschadPeresech(a, b) {

  };
  T.init = function () {
    setInterval(function () {
      if (T.aktiven && pod.celi.length && !anim) {
        var rs = obedinit(pryamougolniki(pod.celi));
        var izm = rs.length !== pod.dyrki.length || rs.some(function (r, i) { var d = pod.dyrki[i]; return !d || Math.abs(r.x - d.x) + Math.abs(r.y - d.y) + Math.abs(r.w - d.w) + Math.abs(r.h - d.h) > 2; });

<script>/* src/demo.js */
/* window.Demo — стабильный программный интерфейс для записи ролика (Playwright → MP4).
   Описание — в README_DEMO.md. Всё, что здесь делается, можно сделать и мышью:
   Demo только нажимает те же кнопки и ждёт, пока закончатся анимации. */
(function () {
  'use strict';
  var OV = window.OV = window.OV || {};
  var VERSIYA = 1;

  function tur() { return OV.tur; }
  function vsego() { return tur() ? tur().vsego : 9; }

  /* Promise: дождаться события 'gotov' для шага n (или любого, если n == null) */
  function zhdatGotov(n, ms) {
    return new Promise(function (ok) {
      var gotovo = false;
      var f = function (tip, k) {
        if (tip !== 'gotov' || (n != null && k !== n)) return;
        gotovo = true; snyat(); ok(k);
      };
      var snyat = function () { var a = tur().slushateli, i = a.indexOf(f); if (i >= 0) a.splice(i, 1); };
      tur().slushateli.push(f);
      setTimeout(function () { if (!gotovo) { snyat(); ok(Demo.step()); } }, ms || 8000);
    });
  }

  function element(n) {
    var d = tur() && tur().deystvie(n);
    if (!d) return null;
    return document.querySelector('[data-demo-id="' + d.demoId + '"]');
  }
  function pryam(el) {
    if (!el) return null;
    var r = el.getBoundingClientRect();
    if (!r.width && !r.height) return null;
    return { x: Math.round(r.left * 10) / 10, y: Math.round(r.top * 10) / 10, width: Math.round(r.width * 10) / 10, height: Math.round(r.height * 10) / 10,
      centerX: Math.round((r.left + r.width / 2) * 10) / 10, centerY: Math.round((r.top + r.height / 2) * 10) / 10 };
  }

  var Demo = {
    version: VERSIYA,

    /* запустить: 'rolik' — экскурсия с приближением и панелью справа; 'tur' — обычная экскурсия; 'svob' — свободный режим.
       Возвращает Promise, который выполнится, когда первый шаг «готов» (анимации закончились). */
    start: function (rezhim) {
      rezhim = rezhim || 'rolik';
      OV.skrytSloy();
      if (rezhim === 'svob') { OV.svobodno(true); return Promise.resolve(-1); }
      var p = zhdatGotov(0);
      OV.ustanovitRolik(rezhim === 'rolik');
      OV.sbros();
      tur().start(0);
      return p;
    },

    /* перейти на шаг n (0…8; 9 — итоговый экран). Promise → номер шага, когда он «готов». */
    goto: function (n) {
      n = Math.max(0, Math.min(vsego(), n | 0));
      var p = zhdatGotov(n);
      if (n >= vsego()) tur().itog(); else { if (!tur().aktiven) OV.skrytSloy(); tur().pereyti(n); }
      return p;
    },

    /* следующий шаг (как кнопка «Дальше») */
    next: function () {
      var n = Demo.step() + 1;
      return Demo.goto(n);
    },

    /* текущий шаг: −1 — экскурсия не идёт; 0…8 — шаги; 9 — итоговый экран */
    step: function () {
      var t = tur();
      if (!t) return -1;
      if (t.shag >= vsego()) return vsego();
      return t.aktiven ? t.shag : -1;
    },

    /* подписка: cb(n, tip) — tip 'start' (шаг начался) или 'gotov' (анимации и камера закончились).
       Возвращает функцию отписки. */
    onStep: function (cb) {
      var f = function (tip, n) { cb(n, tip); };
      tur().slushateli.push(f);
      return function () { var a = tur().slushateli, i = a.indexOf(f); if (i >= 0) a.splice(i, 1); };
    },

    /* элемент, который «нажимается» на шаге n: {selector, demoId, rect, vid, opisanie}.
       rect — в пикселях окна браузера (для page.mouse), null — если элемент сейчас не на экране. */
    target: function (n) {
      if (n == null) n = Demo.step() + 1;
      var d = tur() && tur().deystvie(n);
      if (!d) return null;
      var el = element(n);
      var OPIS = { vkladka: 'вкладка ленты', knopka: 'кнопка ленты', ispravit: 'кнопка «Исправить» у замечания' };
      return { n: n, demoId: d.demoId, selector: '[data-demo-id="' + d.demoId + '"]', vid: d.vid, opisanie: OPIS[d.vid] + (el ? ' «' + (el.getAttribute('data-t') || el.textContent.trim()).slice(0, 40) + '»' : ''), rect: pryam(el) };
    },

    /* выполнить действие шага n так, как будто пользователь нажал его цель.
       Если n — следующий шаг и цель на экране, нажимается сама цель (кнопка ленты, вкладка, «Исправить»);
       иначе — переход, как кнопкой «Дальше»/«Назад». Promise → номер шага, когда он «готов». */
    click: function (n) {
      if (n == null) n = Demo.step() + 1;
      var el = element(n);
      var t = tur();
      if (t && t.aktiven && n === t.shag + 1 && el && pryam(el)) {
        var p = zhdatGotov(n);
        if (el.scrollIntoView && el.closest('#palPult')) el.scrollIntoView({ block: 'nearest' });
        el.click();   // тот же обработчик, что и у мыши: переводит экскурсию на шаг n
        return p;
      }
      return Demo.goto(n);
    },

    /* камера: цель — CSS-селектор, элемент или прямоугольник сцены {x, y, w, h} (сцена 1600×900) */
    focusCamera: function (cel, o) {
      if (typeof cel === 'string') cel = document.querySelector(cel);
      return OV.kamera.fokusirovat(cel, o || { duration: 600 });
    },
    resetCamera: function (o) { return OV.kamera.sbrosit(o || { duration: 500 }); },

    /* 3D-вид: открыть и наехать камерой на элемент — 'ВД-8', 'Р3', 'КП-13', '3.01.1', 'Ш-В1', номер замечания 'З1'
       или 'klapany' (замечание про клапаны: комната, где «Исправить» добавило клапаны). Promise → true, когда камера доехала
       (false — 3D недоступен: нет интернета для three.js). Экскурсия при этом остаётся на своём шаге. */
    pokazat3D: function (elementId) {
      var id = elementId;
      if (id === 'klapany') { var z = (OV.sost.zamechaniya || []).filter(function (x) { return x.vid === 'klapany'; })[0]; id = z ? z.id : '3.01.1'; }
      var p = OV.komandy.pokazat3D(id);
      if (OV.tur && OV.tur.aktiven && OV.kamera.rezhim().vneshnyaya) OV.kamera.fokusirovat(OV.kamera.rasshirit(document.getElementById('vid3d'), 4), { duration: 600 });
      return p;
    },
    zakryt3D: function () { if (OV.vid3d) OV.vid3d.zakryt(); if (OV.tur && OV.tur.aktiven) OV.tur.utochnitKameru(); },

    /* список шагов с заголовками — для сценария и субтитров */
    shagi: function () {
      return (OV.teksty.shagi || []).map(function (s, i) { return { n: i, id: s.id, zagolovok: s.zagolovok, target: (tur().deystvie(i) || {}).demoId || null }; })
        .concat([{ n: vsego(), id: 'itog', zagolovok: OV.teksty.itog.zagolovok, target: null }]);
    },

    /* текущее состояние — для проверок сценария */
    state: function () {
      var s = OV.sost;
      return {
        rezhim: OV.rezhim, rolik: !!OV.rolik, step: Demo.step(), vsego: vsego(),
        zamechaniya: (s.zamechaniya || []).map(function (z) { return { id: z.id, vid: z.vid, vazhnost: z.vazhnost, element: z.elementId, ispravleno: !!s.ispravleno[z.id] }; }),
        klapanov: OV.E.klapany.length
      };
    }
  };
  window.Demo = Demo;
  /* совместимость: window.focusCamera / window.resetCamera уже объявлены камерой */
})();

</script>
<script>/* src/app.js */
/* Состояние, модель, команды надстройки, диалоги, пояснения, режимы, запуск. */
(function () {
  'use strict';
  var OV = window.OV = window.OV || {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return OV.esc(s); };

  OV.E = window.ETAZH;
  OV.NORMY = window.NORMY || null;
  OV.OBORUDOVANIE = window.OBORUDOVANIE || null;

  /* ---------- состояние ---------- */
  function novoeSostoyanie() {
    return {
      tipy: null, rezultat: null, reshetki: null, zamechaniya: null,
      ispravleno: {},   // id замечания → {bylo, stalo}
      zameneno: {},     // id решётки → новый типоразмер (null — ещё не известен)
      obschie: null, zadaniya: null,
      vybor: null, zmVybr: null,
      pult: { razdel: 'vozduh', pod: 'tipy' },
      // настройки проекта (не нормы): критерий шума решёток, перепад на клапанах, унификация вентиляторов
      nastroyki: { zhilcy: {}, ruchnye: {}, kriteriy: 25, perepad: 10, unifikaciya: true, kuhnyaGostinayaZhilaya: false },
      zhurnal: [], vremya: {}, animRashody: false
    };
  }
  OV.sost = novoeSostoyanie();

  /* ---------- модель: чтение etazh.json + результатов ---------- */
  var E = OV.E;
  function po(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
  function plosh(k) { var s = 0; for (var i = 0; i < k.length; i++) { var a = k[i], b = k[(i + 1) % k.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.abs(s) / 2; }
  var tipyKesh = null;
  OV.model = {
    pom: function (id) { return po(E.pomescheniya, id); },
    resh: function (id) { return po(E.reshetki, id); },
    vd: function (id) { return po(E.vozduhovody, id); },
    kv: function (id) { return po(E.kvartiry, id); },
    ploschad: function (id) { return plosh(po(E.pomescheniya, id).kontur); },
    perimetr: function (id) { var k = po(E.pomescheniya, id).kontur, s = 0; for (var i = 0; i < k.length; i++) { var a = k[i], b = k[(i + 1) % k.length]; s += Math.hypot(b[0] - a[0], b[1] - a[1]); } return s; },
    obem: function (id) { return plosh(po(E.pomescheniya, id).kontur) * E.etazh.vysotaPomeshcheniy; },
    dlinaVd: function (id) { var t = po(E.vozduhovody, id).tochki, s = 0; for (var i = 1; i < t.length; i++) s += Math.hypot(t[i][0] - t[i - 1][0], t[i][1] - t[i - 1][1]); return s; },
    spisokTipov: function () { if (!tipyKesh) tipyKesh = Engine.spisokTipov ? Engine.spisokTipov(OV.NORMY) : []; return tipyKesh; },
    imyaTipa: function (tipId) { var t = po(OV.model.spisokTipov(), tipId); return t ? t.imya : (tipId || ''); },
    tipPom: function (id) { var s = OV.sost; if (!s.tipy) return null; for (var i = 0; i < s.tipy.length; i++) if (s.tipy[i].pomeschenieId === id) return s.tipy[i]; return null; },
    rezPom: function (id) { var r = OV.sost.rezultat; return r ? po(r.pomescheniya, id) : null; },
    rezResh: function (id) { var r = OV.sost.reshetki; return r ? po(r.reshetki, id) : null; },
    razmerResh: function (id) { return po(E.reshetki, id).razmer; },
    estVytyazhka: function (pomId) { return E.reshetki.some(function (r) { return r.pomeschenie === pomId; }); },
    estPritok: function (pomId) { return E.klapany.some(function (k) { return k.pomeschenie === pomId; }); },
    neraspoznano: function () { return (OV.sost.tipy || []).filter(function (t) { return !t.tipId; }).length; },
    nedostatochno: function () { return ((OV.sost.reshetki || {}).reshetki || []).filter(function (r) { return r.dostatochno === false; }).length; },
    schetZam: function (v) { var s = OV.sost; return (s.zamechaniya || []).filter(function (z) { return z.vazhnost === v && !s.ispravleno[z.id]; }).length; },
    vybranPom: function (id) { var v = OV.sost.vybor; return v && v.vid === 'pom' && v.id === id; },
    vybranResh: function (id) { var v = OV.sost.vybor; return v && v.vid === 'resh' && v.id === id; },
    vidElementa: function (id) { if (po(E.reshetki, id)) return 'resh'; if (po(E.vozduhovody, id)) return 'vd'; if (po(E.pomescheniya, id)) return 'pom'; return null; }
  };

  function zhurnal(t) {
    OV.sost.zhurnal.unshift(OV.vremya() + ' — ' + t);
    var e = $('pultLog'); if (e) e.textContent = OV.sost.zhurnal[0];
  }

  /* ---------- диалоги (окна Revit/Windows) ---------- */
  var dlg = OV.dialog = {};
  dlg.otkryt = function (o) {
    dlg.zakryt(o.id);
    var sloy = $('sloyDialogov');
    var w = o.w || 640, h = o.h || 420;
    var x = o.x != null ? o.x : Math.round((1600 - w) / 2), y = o.y != null ? o.y : Math.round((900 - h) / 2);
    var fon = document.createElement('div'); fon.className = 'dlg-fon'; fon.setAttribute('data-dlg-fon', o.id);
    var d = document.createElement('div'); d.className = 'dlg'; d.id = 'dlg-' + o.id;
    d.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px';
    d.innerHTML = '<div class="dlg-zag">' + (o.ikona ? OV.ikona(o.ikona, 16) : '') + '<span class="nm">' + esc(o.zag) + '</span><span class="x" data-zakryt="1">' +
      '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10" stroke="#333"/></svg></span></div>' +
      '<div class="dlg-telo">' + o.html + '</div><div class="dlg-niz">' + (o.levo ? '<span class="lev">' + o.levo + '</span>' : '') +
      (o.knopki || [{ t: 'Закрыть', gl: true }]).map(function (k, i) { return '<button type="button" class="kw' + (k.gl ? ' gl' : '') + '" data-kn="' + i + '">' + esc(k.t) + '</button>'; }).join('') + '</div>';
    sloy.appendChild(fon); sloy.appendChild(d);
    d.addEventListener('click', function (e) {
      if (e.target.closest('[data-zakryt]')) { dlg.zakryt(o.id); return; }
      var kn = e.target.closest('[data-kn]');
      if (kn) { var k = (o.knopki || [{}])[+kn.getAttribute('data-kn')]; if (k && k.fn) k.fn(); if (!k || !k.ostavit) dlg.zakryt(o.id); }
    });
    fon.addEventListener('mousedown', function () { d.animate && d.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 180 }); });
    return d;
  };
  dlg.zakryt = function (id) {
    var d = $('dlg-' + id), f = document.querySelector('[data-dlg-fon="' + id + '"]');
    if (d) d.remove(); if (f) f.remove();
    if (OV.poyasnenie && OV.rezhim === 'svob' && OV.poyasnenie.dlyaDialoga === id) OV.poyasnenie.skryt();
  };
  dlg.zakrytVse = function () { $('sloyDialogov').innerHTML = ''; };

  /* ---------- команды надстройки ---------- */
  var K = OV.komandy = {};

  K.vypolnit = function (cmd, o) {
    o = o || {};
    var f = K['_' + cmd];
    if (!f) return;
    f(o);
    if (OV.rezhim === 'svob' && (o.izLenty || o.izPulta) && cmd !== 'obnovit') {
      var cel = o.knopka && o.knopka.closest('.kb') ? o.knopka : (OV.obolochka.knopka(cmd) || o.knopka);
      OV.poyasnenie.dlyaKomandy(cmd, cel);
    }
  };

  function opcSistem() { return { etazhnost: E.etazh.etazhnost, unifikaciya: OV.sost.nastroyki.unifikaciya !== false }; }
  /* пересчитать всё, что уже было посчитано (после правки типа, жильцов, ручного расхода, критерия) */
  function pereschitat() {
    var s = OV.sost;
    if (s.rezultat) s.rezultat = Engine.poschitatVozduhoobmen(E, s.tipy, OV.NORMY, s.nastroyki);
    if (s.reshetki) s.reshetki = Engine.razdatPoReshetkam(E, s.rezultat, OV.OBORUDOVANIE, s.nastroyki);
    if (s.obschie) s.obschie = Engine.obschieDannye(E, s.rezultat, s.reshetki, OV.OBORUDOVANIE, opcSistem());
    if (s.zadaniya) s.zadaniya = Engine.zadaniyaSmezhnikam(E, s.rezultat, OV.OBORUDOVANIE, null, opcSistem());
  }
  function posleIzmeneniya() {
    OV.pult.render(); OV.plan.obnovit(); OV.obolochka.obnovitSvoystva(true);
    if (OV.tur && OV.tur.aktiven) OV.tur.obnovitCeli();
  }

  K._tipy = function (o) {
    var s = OV.sost;
    var nov = Engine.opredelitTipy(E, OV.NORMY) || [];
    if (s.tipy) nov.forEach(function (t) { var st = OV.model.tipPom(t.pomeschenieId); if (st && st.vruchnuyu) { t.tipId = st.tipId; t.vruchnuyu = true; t.uverennost = 1; } });
    s.tipy = nov;
    var n = OV.model.neraspoznano();
    zhurnal('Типы помещений: распознано ' + (nov.length - n) + ' из ' + nov.length + (n ? ', спорных — ' + n : ''));
    if (!o.tiho) {
      OV.pult.otkryt('vozduh', 'tipy', o.bystro ? null : 'tipy');
      OV.obolochka.status('Пульт ОВиК: типы помещений определены. Не распознано: ' + n + '.', true);
    }
    OV.plan.obnovit(); OV.obolochka.obnovitSvoystva();
  };

  K.zadatTip = function (pomId, tipId) {
    var s = OV.sost, t = OV.model.tipPom(pomId);
    if (!t) return;
    t.tipId = tipId; t.vruchnuyu = !!tipId; t.uverennost = tipId ? 1 : 0;
    var p = OV.model.pom(pomId);
    zhurnal('Тип помещения ' + pomId + ' «' + p.imya + '» задан вручную: ' + (tipId ? OV.model.imyaTipa(tipId) : 'не задан'));
    pereschitat();
    if (s.zamechaniya) s.zamechaniya = Engine.proverit(E, s.rezultat, s.reshetki, s.tipy, s.nastroyki);
    posleIzmeneniya();
  };
  K.zadatZhilcov = function (kv, n) {
    var s = OV.sost;
    if (n === '' || n == null || isNaN(n)) delete s.nastroyki.zhilcy[kv]; else s.nastroyki.zhilcy[kv] = Math.max(1, Math.min(20, Math.round(Number(n))));
    zhurnal('Квартира ' + kv + ': жильцов — ' + (s.nastroyki.zhilcy[kv] || 'по умолчанию'));
    pereschitat(); posleIzmeneniya();
  };
  K.zadatRuchnoy = function (pomId, L) {
    var s = OV.sost;
    if (L === '' || L == null || isNaN(L)) delete s.nastroyki.ruchnye[pomId]; else s.nastroyki.ruchnye[pomId] = { vytyazhka: Math.max(0, Number(L)) };
    var p = OV.model.pom(pomId);
    zhurnal('Расход ' + pomId + ' «' + p.imya + '» задан вручную: ' + (s.nastroyki.ruchnye[pomId] ? s.nastroyki.ruchnye[pomId].vytyazhka + ' м³/ч' : 'сброшен'));
    pereschitat();
    if (s.zamechaniya) s.zamechaniya = Engine.proverit(E, s.rezultat, s.reshetki, s.tipy, s.nastroyki);
    posleIzmeneniya();
  };
  K.zadatKriteriy = function (kr) {
    var s = OV.sost;
    s.nastroyki.kriteriy = kr === '<20' ? '<20' : Number(kr);
    zhurnal('Критерий подбора решёток: ' + (kr === '<20' ? 'Lw < 20 дБ(А)' : 'Lw ≤ ' + kr + ' дБ(А)'));
    pereschitat(); posleIzmeneniya();
  };
  K.zadatPerepad = function (dp) {
    var s = OV.sost;
    s.nastroyki.perepad = Number(dp) === 20 ? 20 : 10;
    zhurnal('Перепад давления на клапанах: ' + s.nastroyki.perepad + ' Па (по каталогу; фактический перепад зависит от системы)');
    pereschitat();
    if (s.zamechaniya) { s.zamechaniya = Engine.proverit(E, s.rezultat, s.reshetki, s.tipy, s.nastroyki); s.ispravleno = {}; }
    posleIzmeneniya();
  };
  K.zadatKuhnyuGostinuyu = function (da) {
    var s = OV.sost;

      .concat([['Воздухораспределители', 'Клапан приточный стеновой', (E.klapany[0] && E.klapany[0].model) || 'КП', E.klapany.length,
        ((OV.OBORUDOVANIE && OV.OBORUDOVANIE.pritochnye_klapany) || []).some(function (x) { return /KIV New/.test(x.model); }) ? '<span class="metka ok">есть в каталоге</span>' : '<span class="metka izmeneno">нет в каталоге</span>']])
      .concat(Object.keys(vd).map(function (k) { return ['Воздуховоды', 'Круглый воздуховод', k, vd[k], '—']; }));
    dlg.otkryt({
      id: 'semeystva', zag: 'Пульт ОВиК — Семейства проекта', ikona: 'ovSemeystva', w: 760, h: 440,
      html: '<div style="background:#fff;border:1px solid #d6d6d6"><table class="pt"><colgroup><col style="width:150px"><col><col style="width:80px"><col style="width:50px"><col style="width:190px"></colgroup><thead><tr><th>Категория</th><th>Семейство</th><th>Тип</th><th class="ch">Шт.</th><th>Каталог</th></tr></thead><tbody>' +
        str.map(function (r) { return '<tr class="str"><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td class="ch">' + r[3] + '</td><td>' + r[4] + '</td></tr>'; }).join('') + '</tbody></table></div>' +
        '<p style="margin:8px 0 0;color:#666;white-space:normal">Семейства Revit решёток АМН/АМР Арктос выдаёт по форме на сайте производителя (см. «Источники»).</p>',
      knopki: [{ t: 'Закрыть', gl: true }]
    });
  };
  K._ryad = function () {
    var kat = OV.OBORUDOVANIE && (OV.OBORUDOVANIE.reshetki_vytyazhnye || [])[0];
    var h = '<p style="margin:0 0 10px;color:#444;white-space:normal">Решётки ' + (kat ? esc(kat.proizvoditel) + ' (' + esc(kat.gorod) + '), каталог изд. 10, стр. 01.1.5 — расход, м³/ч (ΔP, Па) при уровне звуковой мощности Lw' : 'каталог не подключён') + '</p>' +
      '<div style="background:#fff;border:1px solid #d6d6d6"><table class="pt"><thead><tr><th>Типоразмер</th><th class="ch">F0, м²</th><th class="ch">Lw &lt; 20</th><th class="ch">Lw 20</th><th class="ch">Lw 25</th><th class="ch">Lw 35</th><th class="ch">Lw 45</th></tr></thead><tbody>';
    if (kat) kat.tiporazmery.forEach(function (t) {
      h += '<tr class="str"><td>АМН ' + t.A_mm + '×' + t.B_mm + '</td><td class="ch">' + String(t.f0_m2).replace('.', ',') + '</td>' + t.tochki.map(function (p) { return '<td class="ch">' + p.rashod_m3ch + ' <span style="color:#888">(' + String(p.dP_pa).replace('<=', '≤') + ')</span></td>'; }).join('') + '</tr>';
    });
    dlg.otkryt({ id: 'ryad', zag: 'Пульт ОВиК — Ряд типоразмеров решёток', ikona: 'ovRyad', w: 720, h: 420, html: h + '</tbody></table></div>', knopki: [{ t: 'Закрыть', gl: true }] });
  };
  K._pult = function () { OV.obolochka.pult(); };
  K._obnovit = function () {
    var s = OV.sost;
    if (s.tipy) K._tipy({ bystro: true, tiho: true });
    if (s.rezultat) K._vozduh({ bystro: true, tiho: true });
    if (s.reshetki) K._reshetki({ bystro: true, tiho: true });
    if (s.zamechaniya) K._proverka({ bystro: true, tiho: true });
    if (s.obschie) K._obschie({ bystro: true, tiho: true, dialog: false });
    if (s.zadaniya) K._zadaniya({ bystro: true, tiho: true });
    OV.pult.render(); OV.plan.obnovit();
    OV.obolochka.toast('Пульт обновлён из модели');
  };

  /* ---------- сброс ---------- */
  var ISHODNAYA = JSON.parse(JSON.stringify(E.reshetki.map(function (r) { return { id: r.id, razmer: r.razmer }; })));
  var ISHODNYE_KLAPANY = JSON.parse(JSON.stringify(E.klapany));
  OV.sbros = function () {
    ISHODNAYA.forEach(function (x) { var r = OV.model.resh(x.id); if (r) r.razmer = x.razmer; });
    E.klapany.length = 0; JSON.parse(JSON.stringify(ISHODNYE_KLAPANY)).forEach(function (k) { E.klapany.push(k); });
    if (OV.vid3d && OV.vid3d.obnovitModel) OV.vid3d.obnovitModel();
    OV.sost = novoeSostoyanie();
    dlg.zakrytVse();
    OV.obolochka.pult(true);
    OV.obolochka.pokazatVkladku('sist');
    OV.plan.vybrat(null, true);
    OV.pult.render();
    OV.plan.obnovit();
    OV.plan.vpisat(0);
    OV.obolochka.status(null);
    if (OV.vid3d) OV.vid3d.zakryt();
    if (!OV.rolik && !OV.kamera.rezhim().mobil) { OV.kamera.polzovatel = false; OV.kamera.sbrosit({ duration: 0 }); }
  };

  /* ---------- режимы ---------- */
  OV.rezhim = 'start';
  OV.rolik = false;
  OV.ustanovitRolik = function (da) {
    document.body.classList.toggle('rolik', !!da);
    if (OV.rolik === !!da) return;
    OV.rolik = !!da;
    OV.obolochka.podognat();
  };
  OV.ustanovitRezhim = function (r) {
    OV.rezhim = r;
    var akt = r === 'tur' && OV.rolik ? 'rolik' : r;
    Array.prototype.forEach.call(document.querySelectorAll('#rezhimy button'), function (b) { b.classList.toggle('akt', b.getAttribute('data-rezhim') === akt); });
    if (r !== 'tur') $('shagInfo').textContent = r === 'svob' ? 'Свободный режим' : '';
  };

  /* ---------- стартовый и финальный экраны ---------- */
  var ZNAK = '<svg width="30" height="30" viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="22" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M3 10h26" stroke="#fff" stroke-width="1.8"/><rect x="18" y="12" width="8" height="12" rx="1" fill="#fff" fill-opacity=".9"/><path d="M7 15h8M7 19h6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>';
  function pokazatSloy(html) {
    var s = $('sloyStart');
    s.innerHTML = html;
    s.classList.add('vid');
    void s.offsetWidth;
    setTimeout(function () { s.classList.add('pokaz'); }, 20);
  }
  OV.skrytSloy = function () {
    var s = $('sloyStart');
    s.classList.remove('pokaz');
    setTimeout(function () { if (!s.classList.contains('pokaz')) { s.classList.remove('vid'); s.innerHTML = ''; } }, 300);
  };
  OV.startEkran = function () {
    var t = OV.teksty.start;
    OV.ustanovitRezhim('start');
    pokazatSloy('<div class="start-kart"><div class="znak">' + ZNAK + '</div><h1>' + esc(t.zagolovok) + '</h1><p>' + esc(t.stroka) + '</p>' +
      '<div class="kn-ryad"><button type="button" class="kb2 gl" data-start="tur" data-demo-id="start-tur">' + esc(t.knopkaTur) + '</button><button type="button" class="kb2" data-start="svob" data-demo-id="start-svob">' + esc(t.knopkaSam) + '</button></div>' +
      (t.maket ? '<p class="maket">' + esc(t.maket) + '</p>' : '') + '<div class="meloch">' + esc(t.meloch) + (OV.kamera.rezhim().mobil ? '' : ' <button type="button" class="ssylka-kn" data-start="rolik" data-demo-id="start-rolik">Режим «Ролик»</button> — с приближением к важному.') + '</div></div>');
  };
  OV.finalEkran = function () {
    var t = OV.teksty.itog;
    var spisok = function (b) { return '<section class="itog-bl"><h3>' + esc(b.zag) + '</h3><ul>' + b.punkty.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' + (b.zametka ? '<p class="itog-prim">' + esc(b.zametka) + '</p>' : '') + '</section>'; };
    pokazatSloy('<div class="start-kart itog-kart"><h1>' + esc(t.zagolovok) + '</h1><p>' + OV.tekst(t.podzagolovok) + '</p>' + (OV.teksty.start.maket ? '<p class="maket">' + esc(OV.teksty.start.maket) + '</p>' : '') +
      '<div class="itog-tri">' + (t.bloki || []).map(function (b) { return '<div class="itog-plitka"><h3>' + esc(b.zag) + '</h3><p>' + esc(b.tekst) + '</p></div>'; }).join('') + '</div>' +
      '<div class="itog-dva">' + (t.pilot ? spisok(t.pilot) : '') + (t.nuzhno ? spisok(t.nuzhno) : '') + (t.etapy ? spisok(t.etapy) : '') + '</div>' +
      '<div class="kn-ryad"><button type="button" class="kb2 gl" data-start="snova" data-demo-id="itog-snova">' + esc(t.knopkaSnova) + '</button><button type="button" class="kb2" data-start="svob2" data-demo-id="itog-svob">' + esc(t.knopkaSam) + '</button>' +
      (t.knopkaIst ? '<button type="button" class="kb2" data-start="ist" data-demo-id="itog-istochniki">' + esc(t.knopkaIst) + '</button>' : '') + '</div></div>');
  };
  OV.svobodno = function (sbrosit) { svobodno(sbrosit); };
  function svobodno(sbrosit) {
    if (OV.tur) OV.tur.ostanovit();
    OV.skrytSloy();
    OV.ustanovitRolik(false);
    if (sbrosit) OV.sbros();
    OV.ustanovitRezhim('svob');
    var mob = OV.kamera.rezhim().mobil;
    setTimeout(function () {
      OV.obolochka.migatVkladkoy('ovik');
      if (mob) OV.kamera.fokusirovat(OV.kamera.rasshirit(OV.obolochka.elVkladki('ovik'), 170), { duration: 600 });
      OV.obolochka.toast(mob ? 'Нажмите вкладку «ОВиК». Двумя пальцами — масштаб, одним — сдвиг, двойной тап — всё окно.'
        : 'Свободный режим: откройте вкладку «ОВиК» и нажимайте кнопки — к каждой появится пояснение.', 5200);
    }, 250);
  }

  /* ---------- запуск ---------- */
  OV.zapusk = function () {
    OV.obolochka.init();
    OV.plan.init(E);
    OV.pult.init();
    OV.poyasnenie.init();
    if (OV.tur) OV.tur.init();
    if (OV.vid3d) OV.vid3d.init();

    $('sloyStart').addEventListener('click', function (e) {
      var b = e.target.closest('[data-start]'); if (!b) return;
      var c = b.getAttribute('data-start');
      if (c === 'tur') { OV.skrytSloy(); OV.tur.start(0); }
      if (c === 'svob') svobodno(false);
      if (c === 'snova') { OV.skrytSloy(); OV.sbros(); OV.tur.start(0); }
      if (c === 'svob' || c === 'svob2' || c === 'ist') document.body.classList.remove('zapis');
      if (c === 'rolik') { OV.skrytSloy(); OV.ustanovitRolik(true); OV.tur.start(0); }
      if (c === 'svob2') svobodno(false);
      if (c === 'ist') { svobodno(false); setTimeout(function () { OV.komandy._istochniki(); }, 350); }
    });
    $('rezhimy').addEventListener('click', function (e) {
      var b = e.target.closest('[data-rezhim]'); if (!b) return;
      var r = b.getAttribute('data-rezhim');
      if ((r === 'tur' || r === 'rolik') && !(OV.rezhim === 'tur' && OV.rolik === (r === 'rolik') && OV.tur.aktiven)) {
        OV.skrytSloy(); OV.ustanovitRolik(r === 'rolik'); OV.sbros(); OV.tur.start(0);
      }
      if (r === 'svob' && OV.rezhim !== 'svob') svobodno(false);
    });
    $('snachala').addEventListener('click', function () {
      if (OV.tur) OV.tur.ostanovit();
      OV.poyasnenie.skryt();
      OV.ustanovitRolik(false);
      OV.sbros();
      OV.kamera.sbrosit({ duration: 0 });
      OV.startEkran();
    });
    OV.sobytie = function (tip, znach) {
      if (tip === 'vkladka' && znach === 'ovik' && OV.tur && OV.tur.aktiven && OV.tur.shag === 0) OV.tur.dalshe();
    };
    // запуск по адресу: ?rezhim=rolik — сразу экскурсия «Ролик» без стартового экрана (для записи MP4);
    // ?rezhim=tur | svob; &shag=N — начать с шага N (0…8)
    var par = {};
    String(location.search || '').replace(/^\?/, '').split('&').forEach(function (kv) { var q = kv.split('='); if (q[0]) par[decodeURIComponent(q[0])] = decodeURIComponent(q[1] || ''); });
    var shagUrl = par.shag != null && par.shag !== '' && !isNaN(par.shag) ? Math.max(0, Math.min(OV.tur.vsego, parseInt(par.shag, 10))) : 0;   // shag=9 — итоговый экран
    if (par.rezhim === 'rolik') {
      document.body.classList.add('zapis');
      OV.ustanovitRolik(true);
      OV.tur.start(shagUrl);
    } else if (par.rezhim === 'tur') OV.tur.start(shagUrl);
    else if (par.rezhim === 'svob') svobodno(false);
    else OV.startEkran();
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', OV.zapusk);
  else OV.zapusk();
})();

</script>
</body>
</html>
