<style>
/* ============ Пульт ОВиК — оболочка «окно Revit» ============ */
:root {
  color-scheme: light;
  --niz-h: 30px;
  --kam: 1;
  --shrift: "Segoe UI", "Segoe UI Variable Text", Tahoma, Arial, sans-serif;
  --ramka: #e9e9e9;
  --lenta: #f7f7f7;
  --panel-niz: #e6e6e6;
  --granica: #cfcfcf;
  --granica-sv: #e0e0e0;
  --tekst: #1f1f1f;
  --tusk: #6a6a6a;
  --navod-fon: #deedfb;
  --navod-gr: #9ecbf2;
  --nazh-fon: #c4def6;
  --nazh-gr: #5f9fdc;
  --vybor: #0b64d0;
  --fail: #1b6ac2;
  --ovik: #0f7c86;
  --ovik-sv: #e3f4f5;
  --oshibka: #d13438;
  --preduprezhdenie: #d99a00;
  --info: #2b78c5;
  --ok: #2f8f4e;
  --ekran-fon: #1d232b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: var(--ekran-fon); overscroll-behavior: none; }
body { font-family: var(--shrift); color: var(--tekst); font-size: 12px; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; font-size: inherit; color: inherit; }

/* ---------- масштаб сцены ---------- */
#ekran { position: fixed; left: 0; top: 0; right: 0; bottom: var(--niz-h); overflow: hidden; touch-action: none; }
#stsena { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; box-shadow: 0 10px 40px rgba(0,0,0,.45); overflow: hidden; background: var(--ramka); will-change: transform; }
.tabl-obl, .zm-spisok, .sv-setka, .dp-derevo, .dlg-telo { touch-action: pan-y; overscroll-behavior: contain; }

/* ---------- окно ---------- */
.rv { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--ramka); user-select: none; -webkit-user-select: none; }
.ic { display: block; flex: none; }

/* строка заголовка */
.rv-zag { height: 32px; flex: none; display: flex; align-items: center; background: var(--ramka); padding-left: 6px; }
.rv-zag .app { width: 22px; height: 22px; border-radius: 3px; background: linear-gradient(#2d7fd6, #1a5fb0); color: #fff; font: 700 14px/22px var(--shrift); text-align: center; margin-right: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.bdd { display: flex; align-items: center; gap: 1px; }
.bdd .qb { height: 24px; min-width: 24px; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 2px; padding: 0 3px; cursor: default; }
.bdd .qb:hover { background: var(--navod-fon); border-color: var(--navod-gr); }
.bdd .qb:active { background: var(--nazh-fon); border-color: var(--nazh-gr); }
.bdd .qb .str { font-size: 8px; color: #555; margin-left: 1px; }
.bdd .sep { width: 1px; height: 16px; background: #c9c9c9; margin: 0 3px; }
.rv-zag .titul { flex: 1; text-align: center; font-size: 12px; color: #2b2b2b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 12px; }
.rv-zag .poisk { display: flex; align-items: center; gap: 6px; width: 250px; height: 22px; border: 1px solid #c8c8c8; background: #fff; border-radius: 2px; padding: 0 6px; color: #8a8a8a; font-size: 11.5px; }
.rv-zag .pr-ikony { display: flex; align-items: center; gap: 2px; margin: 0 6px; }
.rv-zag .pr-ikony .qb { height: 26px; padding: 0 5px; display: flex; align-items: center; gap: 4px; border: 1px solid transparent; border-radius: 2px; color: #444; font-size: 11.5px; }
.rv-zag .pr-ikony .qb:hover { background: var(--navod-fon); border-color: var(--navod-gr); }
.okno-kn { display: flex; height: 32px; }
.okno-kn span { width: 46px; height: 32px; display: flex; align-items: center; justify-content: center; }
.okno-kn span:hover { background: #dadada; }
.okno-kn span.x:hover { background: #e81123; }
.okno-kn span.x:hover svg path { stroke: #fff; }

/* вкладки ленты */
.rv-vkladki { height: 26px; flex: none; display: flex; align-items: flex-end; padding-left: 4px; background: var(--ramka); position: relative; }
.vk { height: 24px; padding: 0 11px; display: flex; align-items: center; border: 1px solid transparent; border-bottom: none; margin-right: 1px; white-space: nowrap; cursor: default; color: #262626; position: relative; transition: background-color .12s; }
.vk:hover { border-color: #d3d3d3; background: #f1f1f1; }
.vk.akt { background: var(--lenta); border-color: var(--granica); height: 25px; margin-bottom: -1px; z-index: 2; font-weight: 600; }
.vk.fail { background: var(--fail); color: #fff; border-color: var(--fail); margin-right: 6px; height: 23px; margin-bottom: 1px; padding: 0 14px; }
.vk.fail:hover { background: #2a7cd6; }
.vk.nash { color: var(--ovik); }
.vk.nash.akt { color: #0a5c64; }
.vk.nash::after { content: ""; position: absolute; left: 6px; right: 6px; top: 2px; height: 2px; border-radius: 1px; background: var(--ovik); opacity: .8; }
.vk.kontekst { background: #e3f1dd; border-color: #b9d8aa; color: #2c5a1e; margin-left: 6px; }
.vk.kontekst::before { content: ""; position: absolute; left: -1px; right: -1px; top: -4px; height: 3px; background: #7fbf63; }
.vk.poyavl { animation: vkPoyavl .6s ease-out 2; }
@keyframes vkPoyavl { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 0 3px rgba(15,124,134,.35); } }

/* лента */
.rv-lenta { height: 96px; flex: none; background: var(--lenta); border-top: 1px solid var(--granica); border-bottom: 1px solid var(--granica); display: flex; overflow: hidden; position: relative; z-index: 1; }
.lenta-soderzh { display: flex; height: 100%; animation: lentaVhod .18s ease-out; }
@keyframes lentaVhod { from { opacity: .35; } to { opacity: 1; } }
.pn { display: flex; flex-direction: column; border-right: 1px solid #dadada; height: 100%; }
.pn-tel { flex: 1; display: flex; align-items: stretch; padding: 3px 3px 1px; gap: 1px; }
.pn-zag { height: 17px; background: var(--panel-niz); color: #4a4a4a; font-size: 11.5px; display: flex; align-items: center; justify-content: center; padding: 0 8px; white-space: nowrap; position: relative; border-top: 1px solid #dcdcdc; }
.pn-zag .zap { position: absolute; right: 2px; bottom: 2px; width: 9px; height: 9px; }
.pn-zag .zap::before { content: ""; position: absolute; right: 1px; bottom: 1px; width: 5px; height: 5px; border-right: 1px solid #777; border-bottom: 1px solid #777; }
.pn-zag .dd { font-size: 8px; margin-left: 4px; color: #666; }
.pn.nash .pn-zag { background: #e1eeef; color: #1c5b61; }
.kb { border: 1px solid transparent; border-radius: 2px; cursor: default; transition: background-color .12s, border-color .12s; position: relative; }
.kb:hover, .kb.navod { background: var(--navod-fon); border-color: var(--navod-gr); }
.kb:active, .kb.nazh { background: var(--nazh-fon); border-color: var(--nazh-gr); }
.kb.aktivna { background: #d3e6f8; border-color: #7fb3e6; }
.kb-L { width: auto; min-width: 44px; display: flex; flex-direction: column; align-items: center; padding: 2px 4px 0; }
.kb-L .ic { margin: 1px auto 2px; }
.kb-L .pd { font-size: 12px; line-height: 13px; text-align: center; color: #222; white-space: nowrap; }
.pn.svernuta .pn-zag { display: none; }
.pn.svernuta .pn-tel { padding-bottom: 3px; }
.kb-L .str { font-size: 8px; line-height: 8px; color: #555; margin-top: 1px; }
.stopka { display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; padding-top: 1px; }
.kb-S { height: 22px; display: flex; align-items: center; gap: 4px; padding: 0 5px 0 3px; white-space: nowrap; font-size: 12px; }
.kb-S .str { font-size: 8px; color: #555; }
.kb.nash-k .pd { color: #13343a; }

/* строка параметров */
.rv-parametry { height: 28px; flex: none; display: flex; align-items: center; background: #f1f1f1; border-bottom: 1px solid var(--granica); padding: 0 8px; gap: 8px; font-size: 12px; color: #333; }
.rv-parametry .izm { display: flex; align-items: center; gap: 5px; padding-right: 8px; border-right: 1px solid #cfcfcf; height: 18px; }
.rv-parametry .pole { display: flex; align-items: center; gap: 5px; }
.rv-parametry .pole .sel { height: 20px; min-width: 110px; border: 1px solid #bdbdbd; background: #fff; padding: 0 16px 0 5px; line-height: 18px; position: relative; font-size: 11.5px; }
.rv-parametry .pole .sel::after { content: "▾"; position: absolute; right: 4px; top: 0; font-size: 9px; color: #555; }
.rv-parametry .chk { width: 13px; height: 13px; border: 1px solid #8a8a8a; background: #fff; display: inline-block; }

/* тело окна */
.rv-telo { flex: 1; display: flex; min-height: 0; background: #d9d9d9; }
.rv-levo { width: 262px; flex: none; display: flex; flex-direction: column; background: var(--ramka); }
.rv-centr { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; }
.rv-pravo { width: 388px; flex: none; display: flex; flex-direction: column; background: var(--ramka); transition: width .25s ease, opacity .2s; overflow: hidden; }
.rv-pravo.skryt { width: 0; opacity: 0; }
.razdel-v { width: 4px; flex: none; background: #d4d4d4; }
.razdel-v.skryt { display: none; }
.razdel-g { height: 4px; flex: none; background: #d4d4d4; }

/* палитры */
.pal { display: flex; flex-direction: column; background: #fff; border: 1px solid #c4c4c4; min-height: 0; }
.pal-zag { height: 24px; flex: none; display: flex; align-items: center; padding: 0 4px 0 8px; background: var(--ramka); border-bottom: 1px solid #cfcfcf; font-size: 12px; color: #262626; gap: 4px; }
.pal-zag .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-zag .mk { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 2px; }
.pal-zag .mk:hover { background: var(--navod-fon); border-color: var(--navod-gr); }
.pal-svoystva { height: 398px; flex: none; }
.pal-dispetcher { flex: 1; }

/* свойства */
.sv-tip { height: 58px; flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #d8d8d8; background: #fff; position: relative; }
.sv-tip .ico { width: 44px; height: 44px; border: 1px solid #d0d0d0; display: flex; align-items: center; justify-content: center; background: #fafafa; }
.sv-tip .nm1 { font-size: 12.5px; color: #1c1c1c; }
.sv-tip .nm2 { font-size: 11.5px; color: #555; margin-top: 2px; }
.sv-tip .str { position: absolute; right: 8px; top: 22px; font-size: 9px; color: #666; }
.sv-filtr { height: 30px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-bottom: 1px solid #d8d8d8; }
.sv-filtr .sel { flex: 1; height: 21px; border: 1px solid #bdbdbd; background: #fff; padding: 0 16px 0 5px; line-height: 19px; position: relative; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sv-filtr .sel::after { content: "▾"; position: absolute; right: 4px; top: 0; font-size: 9px; color: #555; }
.sv-filtr .btn { height: 21px; padding: 0 8px; border: 1px solid #bdbdbd; background: #f3f3f3; line-height: 19px; font-size: 11.5px; white-space: nowrap; color: #555; }
.sv-setka { flex: 1; overflow: auto; font-size: 11.5px; scrollbar-width: thin; }
.sv-gr { height: 21px; display: flex; align-items: center; gap: 4px; background: #ececec; border-bottom: 1px solid #dcdcdc; padding: 0 6px; font-weight: 600; color: #333; }
.sv-gr .tg { font-size: 8px; color: #555; width: 10px; }
.sv-str { display: flex; min-height: 20px; border-bottom: 1px solid #ececec; }
.sv-str .k { width: 48%; padding: 2px 6px 2px 16px; border-right: 1px solid #e3e3e3; color: #2b2b2b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sv-str .z { flex: 1; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #111; }
.sv-str .z.tusk { color: #9a9a9a; }
.sv-str .z .btnz { display: inline-block; border: 1px solid #c6c6c6; background: #f5f5f5; padding: 0 6px; line-height: 14px; }
.sv-str.nash .k { color: #0d5d65; }
.sv-str .z .chk { width: 12px; height: 12px; border: 1px solid #8a8a8a; display: inline-block; vertical-align: -2px; background: #fff; }
.sv-str.obnov .z { animation: obnov 1.2s ease-out; }
@keyframes obnov { 0% { background: #fff3b0; } 100% { background: transparent; } }
.sv-niz { height: 30px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-top: 1px solid #d8d8d8; background: #fafafa; }
.sv-niz a { color: #1a64b8; text-decoration: none; font-size: 11.5px; }
.sv-niz .btn { height: 22px; padding: 0 12px; border: 1px solid #bdbdbd; background: #eee; color: #999; line-height: 20px; font-size: 11.5px; }

/* диспетчер проекта */
.dp-derevo { flex: 1; overflow: auto; padding: 3px 0; font-size: 12px; scrollbar-width: thin; }
.dp-uz { height: 19px; display: flex; align-items: center; white-space: nowrap; padding-right: 6px; cursor: default; }
.dp-uz:hover { background: #eef5fd; }
.dp-uz.vybr { background: #cce4f7; }
.dp-uz .tg { width: 14px; flex: none; text-align: center; font-size: 8px; color: #5a5a5a; }
.dp-uz .ik { width: 18px; flex: none; display: flex; justify-content: center; }
.dp-uz .t { overflow: hidden; text-overflow: ellipsis; }
.dp-uz.tek .t { font-weight: 700; }

/* вкладки видов */
.rv-vid-vkladki { height: 27px; flex: none; display: flex; align-items: flex-end; background: #dedede; border-bottom: 1px solid #c7c7c7; padding-left: 2px; }
.vv { height: 25px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; background: #fff; border: 1px solid #c7c7c7; border-bottom: none; margin-bottom: -1px; font-size: 12px; }
.vv .x { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 2px; }
.vv .x:hover { background: #e3e3e3; }
.vv.neakt { background: #e9e9e9; color: #555; margin-left: 1px; margin-bottom: 0; height: 24px; }
.rv-vid-vkladki .menu { margin-left: auto; width: 26px; height: 24px; display: flex; align-items: center; justify-content: center; color: #555; }

/* чертёжная область */
.rv-vid { flex: 1; position: relative; min-height: 0; background: #fff; overflow: hidden; cursor: default; }
.rv-vid.sdvig { cursor: grabbing; }
.rv-vid.gotov-sdvig { cursor: grab; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.nav-panel { position: absolute; right: 8px; top: 10px; width: 30px; background: rgba(250,250,250,.96); border: 1px solid #c9c9c9; border-radius: 2px; display: flex; flex-direction: column; align-items: center; padding: 3px 0; gap: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.nav-panel .nb { width: 26px; height: 24px; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 2px; position: relative; }
.nav-panel .nb:hover { background: var(--navod-fon); border-color: var(--navod-gr); }
.nav-panel .nb .str { position: absolute; right: 0; bottom: 0; font-size: 6px; color: #555; }
.nav-panel .sep { width: 20px; height: 1px; background: #d5d5d5; }

/* панель управления видом */
.rv-vid-panel { height: 25px; flex: none; display: flex; align-items: center; background: #f0f0f0; border-top: 1px solid #cbcbcb; padding: 0 4px; gap: 1px; }
.rv-vid-panel .msh { padding: 0 8px; height: 21px; display: flex; align-items: center; border: 1px solid transparent; font-size: 12px; white-space: nowrap; }
.rv-vid-panel .vb { width: 23px; height: 21px; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 2px; }
.rv-vid-panel .vb:hover, .rv-vid-panel .msh:hover { background: var(--navod-fon); border-color: var(--navod-gr); }
.rv-vid-panel .sep { width: 1px; height: 15px; background: #cdcdcd; margin: 0 3px; }
.rv-vid-panel .kursor { margin-left: auto; color: #777; font-size: 11px; padding-right: 6px; font-variant-numeric: tabular-nums; }

/* строка состояния */
.rv-status { height: 25px; flex: none; display: flex; align-items: center; background: var(--ramka); border-top: 1px solid #cfcfcf; padding: 0 8px; gap: 8px; font-size: 12px; color: #2a2a2a; }
.rv-status .soobsch { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-status .blk { display: flex; align-items: center; gap: 4px; height: 19px; padding: 0 5px; border: 1px solid transparent; white-space: nowrap; }
.rv-status .blk:hover { background: var(--navod-fon); border-color: var(--navod-gr); }
.rv-status .blk .sel { border: 1px solid #c3c3c3; background: #fff; height: 19px; padding: 0 16px 0 5px; line-height: 17px; position: relative; font-size: 11.5px; }
.rv-status .blk .sel::after { content: "▾"; position: absolute; right: 4px; top: 0; font-size: 9px; color: #555; }
.rv-status .sep { width: 1px; height: 15px; background: #c9c9c9; }
.rv-status .schet { font-variant-numeric: tabular-nums; min-width: 14px; }

/* ============ SVG план ============ */
#plan text { font-family: var(--shrift); }
.pl-steny { fill: #cbcbcb; stroke: #8f8f8f; }
.pl-pom { fill: #fff; stroke: #8f8f8f; }
.pl-hit { fill: transparent; stroke: none; cursor: default; }
.pl-proem { fill: #fff; stroke: none; }
.pl-lin { stroke: #8f8f8f; fill: none; }
.pl-lin-t { stroke: #a6a6a6; fill: none; }
.pl-os { stroke: #505050; fill: none; }
.pl-os-kr { fill: #fff; stroke: #303030; }
.pl-os-t { fill: #202020; }
.pl-raz { stroke: #3a3a3a; fill: none; }
.pl-raz-t { fill: #202020; }
.pl-marka-imya { fill: #141414; }
.pl-marka-n { fill: #2d2d2d; }
.pl-shahta { fill: #fff; stroke: #6e6e6e; }
.pl-sistema-m rect { fill: #fff; }
.pl-reshetka { cursor: default; }
.pl-reshetka .kv { fill: #fff; }
.pl-vd { cursor: default; }
.pl-podsv { fill: none; stroke: #3d8fe0; pointer-events: none; }
.pl-vybor { fill: rgba(11,100,208,.08); stroke: var(--vybor); pointer-events: none; }
.pl-neraspozn { fill: rgba(255,208,0,.33); stroke: #e0a800; pointer-events: none; animation: migZh 1.6s ease-in-out infinite; }
@keyframes migZh { 0%,100% { fill-opacity: 1; } 50% { fill-opacity: .45; } }
.pl-krasn { fill: rgba(209,52,56,.12); stroke: var(--oshibka); pointer-events: none; }
.pl-rashod rect { stroke-width: 1; }
.pl-rashod { animation: rashodVhod .3s ease-out both; }
@keyframes rashodVhod { from { opacity: 0; } to { opacity: 1; } }
.pl-otkr { fill: none; stroke: var(--oshibka); pointer-events: none; animation: pulsOtkr 1.2s ease-in-out infinite; }
@keyframes pulsOtkr { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .3; } }

/* ============ Пульт ОВиК ============ */
.pal-pult { flex: 1; border-color: #bcbcbc; }
.pult-panel { height: 34px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid #dadada; background: #fafafa; font-size: 11.5px; color: #444; }
.pult-panel .sel { height: 22px; border: 1px solid #bdbdbd; background: #fff; padding: 0 18px 0 6px; line-height: 20px; position: relative; }
.pult-panel .sel::after { content: "▾"; position: absolute; right: 5px; top: 0; font-size: 9px; color: #555; }
.pult-panel .ist { margin-left: auto; display: flex; align-items: center; gap: 4px; color: #6a6a6a; white-space: nowrap; }
.pult-panel .ist b { font-weight: 600; color: #444; }
.pult-panel .ik { width: 24px; height: 22px; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 2px; }
.pult-panel .ik:hover { background: var(--navod-fon); border-color: var(--navod-gr); }
.pult-razdely { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pr { display: flex; flex-direction: column; border-bottom: 1px solid #dcdcdc; min-height: 0; }
.pr.otkr { flex: 1; }
.pr-zag { height: 30px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 8px; background: #f3f3f3; cursor: default; transition: background-color .12s; }
.pr-zag:hover { background: #e8f1fb; }

.pr-zag .nm { font-weight: 600; font-size: 12px; color: #1f1f1f; }
.pr-zag .st { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 11px; color: #777; white-space: nowrap; }
.tochka { width: 8px; height: 8px; border-radius: 50%; background: #b5b5b5; flex: none; }

.pr-telo { flex: 1; min-height: 0; display: none; flex-direction: column; }
.pr.otkr .pr-telo { display: flex; animation: prOtkr .22s ease-out; }
@keyframes prOtkr { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.pusto { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #7a7a7a; padding: 18px 24px; text-align: center; font-size: 12px; }
.pusto .ic { opacity: .55; }
.pusto b { color: #4a4a4a; font-weight: 600; }
.pusto .kn { margin-top: 4px; }
.pv { height: 28px; flex: none; display: flex; align-items: flex-end; gap: 1px; padding: 0 6px; border-bottom: 1px solid #d3d3d3; background: #fafafa; }
.pv span { height: 24px; padding: 0 10px; display: flex; align-items: center; gap: 5px; border: 1px solid transparent; border-bottom: none; font-size: 11.5px; color: #444; cursor: default; }
.pv span:hover { background: #eef4fb; }
.pv span.akt { background: #fff; border-color: #d3d3d3; margin-bottom: -1px; height: 25px; color: #111; font-weight: 600; }
.pv .sch { font-size: 10px; background: #e0e0e0; color: #444; border-radius: 7px; padding: 0 5px; line-height: 13px; font-weight: 600; }

.pv .sch.kr { background: #f6c3c4; color: #7a1417; }
.tabl-obl { flex: 1; overflow: auto; min-height: 0; scrollbar-width: thin; position: relative; }
table.pt { width: 100%; border-collapse: collapse; font-size: 11.5px; table-layout: fixed; }

table.pt tr.str:hover td { background: #eef5fd; }
table.pt tr.str.vybr td { background: #d6e8fa; }
table.pt tr.zh td { background: #fff6cf; }
table.pt tr.zh:hover td { background: #ffefad; }
table.pt tr.kr td { background: #fde7e7; color: #8c1d20; }

table.pt select { width: 100%; height: 19px; font: 11.5px var(--shrift); border: 1px solid #c3c3c3; background: #fff; padding: 0 2px; }

.uv { display: inline-block; width: 30px; height: 5px; background: #e3e3e3; border-radius: 3px; overflow: hidden; vertical-align: middle; }
.uv i { display: block; height: 100%; background: var(--ok); }

.ssylka { color: #1a64b8; cursor: default; border-bottom: 1px dotted #1a64b8; }
.itogo { flex: none; border-top: 1px solid #d3d3d3; background: #f8f9fa; padding: 6px 8px; font-size: 11.5px; color: #333; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.pult-niz { height: 24px; flex: none; border-top: 1px solid #dadada; display: flex; align-items: center; padding: 0 8px; font-size: 11px; color: #777; gap: 6px; background: #fafafa; white-space: nowrap; overflow: hidden; }

/* метки «подставит расчётный модуль» */
.ph { display: inline-block; padding: 0 4px; border: 1px dashed #7aa7c7; border-radius: 3px; background: #f1f7fc; color: #3b6f95; font-style: italic; font-size: .93em; line-height: 1.35; white-space: nowrap; }

/* замечания */
.zm-spisok { flex: 1; overflow: auto; min-height: 0; scrollbar-width: thin; }
.zm { display: flex; gap: 8px; padding: 8px 8px 8px 6px; border-bottom: 1px solid #ececec; cursor: default; transition: background-color .15s; border-left: 3px solid transparent; }
.zm:hover { background: #f3f8fd; }
.zm.vybr { background: #e1eefb; }
.zm.oshibka { border-left-color: var(--oshibka); }
.zm.preduprezhdenie { border-left-color: var(--preduprezhdenie); }
.zm.info { border-left-color: var(--info); }
.zm.ispr { border-left-color: var(--ok); background: #f1f9f3; }
.zm .zn { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.zm .tx { flex: 1; font-size: 11.5px; line-height: 1.4; color: #222; white-space: normal; }
.zm .mt { font-size: 10.5px; color: #7a7a7a; margin-top: 3px; display: flex; gap: 8px; align-items: center; }
.zm .knopki { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.kn { height: 22px; padding: 0 10px; border: 1px solid #b9b9b9; background: #fbfbfb; border-radius: 3px; font-size: 11.5px; cursor: default; white-space: nowrap; transition: background-color .12s, border-color .12s; }
.kn:hover { background: var(--navod-fon); border-color: var(--navod-gr); }
.kn:active { background: var(--nazh-fon); border-color: var(--nazh-gr); }
.kn.gl { background: var(--ovik); border-color: #0b646c; color: #fff; }
.kn.gl:hover { background: #12909b; }
.kn.nazh { background: var(--nazh-fon); border-color: var(--nazh-gr); }
.bs { margin-top: 6px; border: 1px solid #cfe3d5; border-radius: 4px; overflow: hidden; background: #fff; animation: prOtkr .25s ease-out; }
.bs table { width: 100%; border-collapse: collapse; font-size: 11px; }
.bs th { background: #eef6f0; color: #2c5a37; text-align: left; padding: 3px 6px; font-weight: 600; }
.bs td { padding: 3px 6px; border-top: 1px solid #edf2ee; }
.bs td.bylo { white-space: nowrap; color: #9a2a2d; text-decoration: line-through; text-decoration-color: rgba(154,42,45,.45); }
.bs td.stalo { color: #1f6b35; font-weight: 600; }
.metka { display: inline-block; border-radius: 3px; padding: 0 6px; font-size: 10.5px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.metka.novoe { background: #dbeafe; color: #1e4f9a; }
.metka.izmeneno { background: #ffe8b3; color: #7a4d00; }
.metka.bez { background: #eeeeee; color: #6f6f6f; font-weight: 400; }
.metka.ok { background: #dcf1e2; color: #1f6b35; }

/* ============ диалоги ============ */
#sloyDialogov { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
.dlg-fon { position: absolute; inset: 0; background: rgba(0,0,0,.08); pointer-events: auto; animation: fonVhod .2s ease-out; }
@keyframes fonVhod { from { opacity: 0; } to { opacity: 1; } }
.dlg { position: absolute; background: #fff; border: 1px solid #9a9a9a; box-shadow: 0 12px 40px rgba(0,0,0,.28); display: flex; flex-direction: column; pointer-events: auto; animation: dlgVhod .22s ease-out; border-radius: 6px; overflow: hidden; }
@keyframes dlgVhod { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
.dlg-zag { height: 32px; flex: none; display: flex; align-items: center; padding-left: 12px; font-size: 12px; background: #fff; border-bottom: 1px solid #e5e5e5; gap: 8px; }
.dlg-zag .nm { flex: 1; }
.dlg-zag .x { width: 44px; height: 31px; display: flex; align-items: center; justify-content: center; }
.dlg-zag .x:hover { background: #e81123; }
.dlg-zag .x:hover svg path { stroke: #fff; }
.dlg-telo { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; background: #f9f9f9; }
.dlg-niz { height: 48px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 14px; border-top: 1px solid #e3e3e3; background: #f3f3f3; }
.dlg-niz .kw { min-width: 86px; height: 28px; border: 1px solid #c4c4c4; background: #fdfdfd; border-radius: 4px; font-size: 12px; cursor: default; }
.dlg-niz .kw:hover { background: #f0f0f0; }
.dlg-niz .kw.gl { background: #005fb8; border-color: #004f9a; color: #fff; }
.dlg-niz .kw.gl:hover { background: #0a6cc9; }
.dlg-niz .lev { margin-right: auto; color: #6a6a6a; font-size: 11.5px; }
/* лист общих данных */
.list-a3 { background: #fff; border: 1px solid #c9c9c9; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin: 0 auto; position: relative; padding: 18px 18px 18px 46px; width: 900px; }
.list-a3::before { content: ""; position: absolute; left: 36px; top: 8px; right: 8px; bottom: 8px; border: 1.5px solid #222; pointer-events: none; }
.list-a3 h4 { margin: 4px 0 8px; text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .2px; }
.list-a3 table { width: 100%; border-collapse: collapse; font-size: 11px; }
.list-a3 th, .list-a3 td { border: 1px solid #333; padding: 4px 5px; text-align: center; vertical-align: middle; }
.list-a3 th { font-weight: 600; background: #fff; }
.list-a3 td.l { text-align: left; }
.list-a3 tr.nov td { animation: obnov 1.4s ease-out; }
.shtamp { margin-top: 14px; margin-left: auto; width: 480px; border: 1.5px solid #222; display: grid; grid-template-columns: 70px 1fr 120px; font-size: 10.5px; }
.shtamp div { border: 1px solid #333; padding: 3px 5px; min-height: 20px; }
.shtamp .kod { grid-column: 2 / 4; text-align: center; font-weight: 600; font-size: 12px; }
.shtamp .nm { grid-column: 1 / 3; }

/* ============ подсказка ленты ============ */
.rv-tip { position: absolute; z-index: 60; max-width: 320px; background: #fff; border: 1px solid #a9a9a9; box-shadow: 0 4px 14px rgba(0,0,0,.2); padding: 8px 10px; font-size: 12px; color: #222; pointer-events: none; opacity: 0; transition: opacity .15s; }
.rv-tip.vid { opacity: 1; }
.rv-tip b { display: block; font-weight: 600; margin-bottom: 4px; }
.rv-tip .niz { margin-top: 8px; padding-top: 6px; border-top: 1px solid #e3e3e3; color: #555; font-size: 11.5px; display: flex; align-items: center; gap: 5px; }

/* ============ экскурсия ============ */
#sloyEkskursii { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
#zatemnenie { position: absolute; inset: 0; background-color: rgba(16,24,34,0); transition: background-color .25s, visibility 0s linear .25s; pointer-events: none; visibility: hidden; }
#zatemnenie.vid { background-color: rgba(16,24,34,.52); pointer-events: auto; visibility: visible; transition: background-color .25s, visibility 0s; }
#kolca { position: absolute; inset: 0; pointer-events: none; }
.kolco { position: absolute; border: calc(2px / var(--kam)) solid #3aa0ff; border-radius: 6px; box-shadow: 0 0 0 3px rgba(58,160,255,.25), 0 0 18px rgba(58,160,255,.45); animation: kolcoPuls 1.8s ease-in-out infinite; transition: left .25s ease, top .25s ease, width .25s ease, height .25s ease, opacity .2s; }
.kolco.vtor { border-style: dashed; border-color: #6cb8ff; box-shadow: 0 0 0 2px rgba(108,184,255,.2); animation: none; }
@keyframes kolcoPuls { 0%,100% { box-shadow: 0 0 0 3px rgba(58,160,255,.25), 0 0 14px rgba(58,160,255,.35); } 50% { box-shadow: 0 0 0 6px rgba(58,160,255,.12), 0 0 24px rgba(58,160,255,.55); } }
.poyasnenie { position: absolute; width: 410px; background: #fff; border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.08); pointer-events: auto; opacity: 0; transform: translateY(10px); transition: opacity .22s ease, transform .22s ease, left .28s ease, top .28s ease; visibility: hidden; overflow: hidden; }
.poyasnenie.vid { opacity: 1; transform: none; visibility: visible; }
.poyasnenie.sprava { transform: translateX(14px); }
.poyasnenie.sleva { transform: translateX(-14px); }
.poyasnenie.vid.sprava, .poyasnenie.vid.sleva { transform: none; }
.pj-zag { padding: 12px 16px 10px; background: linear-gradient(135deg, #0f7c86, #0d6570); color: #fff; }
.pj-zag .shg { font-size: 11px; opacity: .85; display: flex; align-items: center; gap: 8px; }
.pj-zag .toch { display: flex; gap: 4px; }
.pj-zag .toch i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.35); display: block; transition: background-color .2s, width .2s; }

.pj-zag h3 { margin: 4px 0 0; font-size: 16px; font-weight: 600; }
.pj-telo { padding: 10px 16px 4px; max-height: 470px; overflow: auto; }
.pj-blok { display: flex; gap: 10px; padding: 7px 0; }
.pj-blok + .pj-blok { border-top: 1px solid #eef0f2; }
.pj-blok .zn { width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.pj-blok.chto .zn { background: #e3f4f5; color: #0f7c86; }
.pj-blok.kak .zn { background: #e8eefb; color: #2b5fb8; }
.pj-blok.vyg .zn { background: #e6f5ea; color: #2f8f4e; }
.pj-blok h5 { margin: 0 0 2px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: #6b7785; font-weight: 600; }
.pj-blok p { margin: 0; font-size: 13px; line-height: 1.45; color: #1d2733; }
.pj-niz { display: flex; align-items: center; gap: 8px; padding: 10px 16px 14px; }
.pj-niz .kp { height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid #c9d1d9; background: #fff; font-size: 13px; cursor: pointer; transition: background-color .15s, border-color .15s; }
.pj-niz .kp:hover { background: #f1f4f7; }
.pj-niz .kp:disabled { opacity: .4; cursor: default; }
.pj-niz .kp.gl { background: #0f7c86; border-color: #0f7c86; color: #fff; font-weight: 600; }

.pj-niz .prop { margin-left: auto; background: none; border: none; color: #6b7785; font-size: 12px; cursor: pointer; padding: 4px 2px; }
.pj-niz .prop:hover { color: #1d2733; text-decoration: underline; }
.poyasnenie .strelka { position: absolute; width: 14px; height: 14px; background: #fff; transform: rotate(45deg); box-shadow: -1px -1px 0 rgba(0,0,0,.06); }

/* стартовый и финальный экраны — вне окна, в настоящих пикселях */
#sloyStart { position: fixed; left: 0; top: 0; right: 0; bottom: var(--niz-h); z-index: 95; overflow: auto; padding: 16px; box-sizing: border-box; display: none; align-items: center; justify-content: center; background: rgba(233,237,242,.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; transition: opacity .3s; }
#sloyStart.vid { display: flex; }
#sloyStart.vid.pokaz { opacity: 1; }
.start-kart { width: 640px; max-width: 100%; box-sizing: border-box; margin: auto; background: #fff; border-radius: 14px; box-shadow: 0 24px 70px rgba(15,30,45,.3), 0 0 0 1px rgba(0,0,0,.06); padding: 34px 40px 30px; transform: translateY(8px); transition: transform .35s ease; }
#sloyStart.pokaz .start-kart { transform: none; }
.start-kart .znak { width: 54px; height: 54px; border-radius: 12px; background: linear-gradient(135deg, #12909b, #0b5f68); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 6px 16px rgba(15,124,134,.35); }
.start-kart h1 { margin: 0 0 10px; font-size: 27px; font-weight: 600; color: #14212e; letter-spacing: -.2px; }
.start-kart p { margin: 0; font-size: 15px; line-height: 1.5; color: #3a4754; }
.start-kart .kn-ryad { display: flex; gap: 10px; margin-top: 24px; }
.start-kart .kb2 { height: 42px; padding: 0 22px; border-radius: 8px; font-size: 14.5px; border: 1px solid #c7d0d9; background: #fff; cursor: pointer; transition: background-color .15s, transform .1s; }
.start-kart .kb2:hover { background: #f1f4f7; }
.start-kart .kb2:active { transform: translateY(1px); }
.start-kart .kb2.gl { background: #0f7c86; border-color: #0f7c86; color: #fff; font-weight: 600; }
.start-kart .kb2.gl:hover { background: #12909b; }
.start-kart .meloch { margin-top: 14px; font-size: 12px; color: #7a8795; }
.ssylka-kn { background: none; border: none; padding: 0; color: #0f7c86; font: inherit; text-decoration: underline; cursor: pointer; }
.start-kart ul { margin: 14px 0 0; padding: 0; list-style: none; }
.start-kart li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; font-size: 14px; color: #243240; border-top: 1px solid #eef1f4; }
.start-kart li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #0f7c86; margin-top: 7px; flex: none; }

/* всплывающее сообщение */
.toast { position: fixed; left: 50%; bottom: calc(var(--niz-h) + 16px); max-width: calc(100vw - 24px); box-sizing: border-box; text-overflow: ellipsis; overflow: hidden; transform: translate(-50%, 10px); background: rgba(32,38,46,.94); color: #fff; padding: 9px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 96; white-space: nowrap; }
.toast.vid { opacity: 1; transform: translate(-50%, 0); }

/* низ страницы (вне окна) */
#nizStranicy { position: fixed; left: 0; right: 0; bottom: 0; height: 30px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #151a20; color: #9aa6b2; font-size: 11.5px; z-index: 5; }
#nizStranicy .snoska { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #8b96a2; }
.rezhimy { display: flex; background: #242b33; border-radius: 5px; padding: 2px; flex: none; }
.rezhimy button { height: 22px; padding: 0 12px; border: none; background: transparent; color: #aab4be; border-radius: 4px; cursor: pointer; font-size: 11.5px; transition: background-color .15s, color .15s; }
.rezhimy button.akt { background: #0f7c86; color: #fff; }
.rezhimy button:not(.akt):hover { color: #fff; }
.shag-info { min-width: 90px; color: #c6d0da; white-space: nowrap; }
.snachala { height: 22px; padding: 0 10px; border: 1px solid #3a4550; background: transparent; color: #aab4be; border-radius: 4px; cursor: pointer; font-size: 11.5px; flex: none; }
.snachala:hover { color: #fff; border-color: #5a6672; }
#uzkiy { position: fixed; left: 8px; right: 8px; top: 8px; display: none; align-items: center; gap: 8px; background: rgba(255,248,220,.97); color: #4a3b00; border: 1px solid #e5d28a; border-radius: 8px; padding: 8px 10px; font-size: 13px; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
#uzkiy span { flex: 1; }
#uzkiy button { border: none; background: transparent; font-size: 18px; line-height: 1; color: #6b5a10; cursor: pointer; padding: 0 4px; }
#uzkiy.vid { display: flex; }
/* ============ шторка-пояснение (телефон и режим «Ролик») ============ */
.shtorka { position: fixed; z-index: 92; background: #fff; color: #1d2733; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.28); font-size: 15px; visibility: hidden; transition: transform .3s ease, visibility 0s linear .3s; touch-action: pan-y; }
.shtorka.vid { visibility: visible; transform: none !important; transition: transform .3s ease, visibility 0s; }
.shtorka.niz { left: 0; right: 0; bottom: var(--niz-h); height: min(40dvh, 380px); border-radius: 16px 16px 0 0; transform: translateY(110%); }

е по кратности объём помещений жилых и общественных зданий высотой 4 м и более принимают V = 4·A (A - площадь пола); формулы L = V·n, L = A·k, L = N·m.","dokument":"СП 60.13330.2020","punkt":"приложение Г, п. Г.2, формулы Г.5-Г.7 и пояснения","citata":"жилых и общественных зданий высотой 4 м и более следует принимать VP = 4А","url":"https://meganorm.ru/mega_doc/dop_fire_update_26042025/reshenie_orlovskogo_ufas_rossii_ot_26_03_2025_N_057_06/0/sp_60_13330_2020_svod_pravil_otoplenie_ventilyatsiya_i.html","status":"tekst"},"dopolnitelnye_trebovaniya":[{"dokument":"ГОСТ Р 70824-2023","punkt":"п. 4.7","citata":"Допускается организация в кухнях притока в объеме, не превышающем 2/3 объема вытяжки.","url":"https://www.sweephelp.ru/norms/gost-70824-2023","status":"tekst"},{"dokument":"ГОСТ Р 70824-2023","punkt":"п. 4.7","citata":"под дверями кухонь рекомендуется предусматривать подрез высотой 0,03 м","kommentar":"или переточная решётка у пола, живое сечение не менее 0,03 м²","url":"https://www.sweephelp.ru/norms/gost-70824-2023","status":"tekst"},{"dokument":"ГОСТ Р 70824-2023","punkt":"п. 4.9","citata":"межкомнатные двери следует предусматривать с подрезами в нижней части высотой не менее 0,015 м","kommentar":"для туалетов, ванных, постирочных, кладовых; переточные решётки - живое сечение, как правило, не менее 0,012 м²","url":"https://www.sweephelp.ru/norms/gost-70824-2023","status":"tekst"},{"dokument":"СП 60.13330.2020","punkt":"п. 7.10.18","citata":"за счет щели между дверью и полом не менее 2 см","url":"https://meganorm.ru/mega_doc/dop_fire_update_26042025/reshenie_orlovskogo_ufas_rossii_ot_26_03_2025_N_057_06/0/sp_60_13330_2020_svod_pravil_otoplenie_ventilyatsiya_i.html","status":"tekst"},{"dokument":"СП 54.13330.2022","punkt":"п. 9.12, последний абзац","citata":"В двери санузла следует предусматривать переточную решетку или зазор под дверью.","url":"https://meganorm.ru/mega_doc/norm_update_29032025/nomenklatura/0/sp_54_13330_2022_svod_pravil_zdaniya_zhilye_mnogokvarti 4.13330.2022","punkt":"п. 7.3","citata":"Допустимые уровни шума, инфразвука и вибрации следует принимать согласно СанПиН 1.2.3685.","url":"https://meganorm.ru/mega_doc/norm_update_29032025/nomenklatura/0/sp_54_13330_2022_svod_pravil_zdaniya_zhilye_mnogokvartirnye.html","status":"tekst"}],"raskhozhdeniya":[{"id":"izm6_sp60","tema":"СП 60.13330.2020: последнее изменение - №6, а не №5","opisanie":"Изм. №5: приказ 17.01.2025 №17/пр, с 25.02.2025. После него вышло Изм. №6: приказ Минстроя 26.05.2026 №327/пр, зарегистрировано 15.06.2026, введено 07.07.2026 (карточка Росстандарта). Оно правит 7.3.22, 7.5.1, 7.5.2 (воздухозабор), убирает «как правило» из 7.3.6, ссылки на СП 131.13330.2025 и др.; таблицы В.1, приложения Л и таблицы для жилья не меняет.","istochniki":["https://protect.gost.ru/sp/changesdetails/25d65837-dfb6-408b-948f-e7f254851ded","https://aeropro.wiki/index.php/%D0%98%D0%B7%D0%BC._6_%D0%BA_%D0%A1%D0%9F_60.13330.2020","https://buildingclub.ru/izmenenie-6-sp-60-13330-2020/"],"reshenie":"Ссылаться на «СП 60.13330.2020 с Изм. №1-6». Текст Изм. №6 читан только в транскрипции aeropro.wiki - исходный PDF Минстроя не открывал."},{"id":"izm5_data","tema":"Дата введения Изм. №5 к СП 60.13330.2020","opisanie":"Росстандарт: 25.02.2025 (утв. 17.01.2025, рег. 19.02.2025). В транскрипции текста изменения на aeropro.wiki стоит «Дата введения - 01.03.2025» (там же опечатка в дате приказа). Изм. №5 правит п. 7.2.9 и 7.6.13, нашей нормы не касается.","istochniki":["https://protect.gost.ru/sp/changesdetails/ab018bcf-ba2a-41ec-9f47-36393b66d6c2","https://aeropro.wiki/index.php/%D0%98%D0%B7%D0%BC._5_%D0%BA_%D0%A1%D0%9F_60.13330.2020"],"reshenie":"Использовать 25.02.2025 (официальная карточка); на нормы таблицы это не влияет."},{"id":"izm6_order_i_skorost","tema":"Изм. №6: номер приказа и предельная скорость воздухозабора","opisanie":"Один результат поиска называл приказ №326/пр; карточка Росстандарта, текст изменения (транскрипция) и buildingclub.ru - №327/пр. Принят №327/пр. Новость c-o-k.ru пишет «предельная скорость увеличена с 2,5 до 4,0 м/с»; в тексте Изм. №6 (транскрипция): 2,5 м/с, а до 4,0 - только при акустическом расчёте по СП 51.13330.","istochniki":["https://protect.gost.ru/sp/changesdetails/25d65837-dfb6-408b-948f-e7f254851ded","https://www.c-o-k.ru/market_news/novaya-redakciya-sp-60-13330-2020-korrektirovka-tehnicheskih-parametrov-i-trebovaniy","https://buildingclub.ru/izmenenie-6-sp-60-13330-2020/","https://aeropro.wiki/index.php/%D0%98%D0%B7%D0%BC._6_%D0%BA_%D0%A1%D0%9F_60.13330.2020"],"reshenie":"Брать текст Изм. №6: 2,5 м/с, до 4,0 м/с - с акустическим расчётом."},{"id":"sp54_izm_dates","tema":"Даты введения Изм. №1 и №2 к СП 54.13330.2022","opisanie":"Изм. №1 (приказ 630/пр от 19.09.2024): Росстандарт - 17.10.2024, Контур.Норматив - 24.10.2024. Изм. №2 (приказ 938/пр от 27.12.2024): Росстандарт - 25.02.2025 (рег. 30.01.2025), Контур.Норматив - 27.12.2024. В самом тексте: «дата введения - с даты опубликования».","istochniki":["https://protect.gost.ru/sp/changesdetails/cf977250-531e-4093-b6e0-0aa1bb031b39","https://normativ.kontur.ru/document?moduleId=9&documentId=491747","https://protect.gost.ru/sp/changesdetails/ca0b09b9-6794-4f69-bf3d-7bb8ec6687b3","https://normativ.kontur.ru/document?moduleId=9&documentId=489823"],"reshenie":"Для цифр таблицы 7.1, пп. 5.11-5.12 неважно: ни Изм. №1, ни №2 их не меняют (Изм. №1: пп. 5.20, 5.21, 6.4.5, 7.5, 7.36, библиография и ссылки; Изм. №2: пп. 4.15, 5.14, 5.15, 5.19, 6.4.2, 6.4.26, табл. 6.1 и ссылки)."},{"id":"sp54_2016_vs_2022_tabl","tema":"Старая (СП 54.13330.2016, табл. 9.1) и действующая (СП 54.13330.2022, табл. 7.1) таблицы воздухообмена","opisanie":"2016: жилые комнаты - «30 м³/ч на одного человека, но не менее 0,35 ч⁻¹»; ванная, душевая, туалет, совмещённый санузел - 25 м³/ч; «помещение с газоиспользующим оборудованием» - 100 м³/ч. 2022: жилые комнаты - «по СП 60.13330»; ванная/душевая/совмещённый санузел - 50 м³/ч; уборная/туалет/постирочная - 25 м³/ч; кухня с газовой плитой - 100 м³/ч. Многие сайты и блоги приводят числа 2016 г. и старее.","istochniki":["https://e-ecolog.ru/docs/bAwC6KHUtCeKgG2Es4Uxf/603","https://meganorm.ru/mega_doc/norm_update_29032025/nomenklatura/0/sp_54_13330_2022_svod_pravil_zdaniya_zhilye_mnogokvartirnye.html"],"reshenie":"Для модели брать только таблицу 7.1 СП 54.13330.2022."},{"id":"gaz_90_75_60","tema":"Кухня с газовой плитой: 90/75/60 м³/ч по числу конфорок против 100 м³/ч","opisanie":"В СП 54.13330.2022 такой градации нет - одна строка «Кухня с газовой плитой… 100 м³/ч». Градацию по конфоркам (60 - две, 75 - три, 90 - четыре) содержат рекомендации АВОК (АВОК 5.2-2012, таблица Б.1; ТР АВОК 4-2004 - 90 м³/ч для 4-конфорочной) и сайты вроде alasca.ru; это не действующая норма СП.","istochniki":["http://ventstar.com.ua/uploads/files/normativ/abok_5_2_2012.pdf","https://meganorm.ru/Data1/44/44696/index.htm"],"reshenie":"Использовать 100 м³/ч (СП 54 табл. 7.1). Значения 90/75/60 в модель не заносить."},{"id":"avok_sovm_sanuzel_75","tema":"Совмещённый санузел: 75 м³/ч (АВОК) против 50 м³/ч (СП 54.13330.2022)","opisanie":"По фрагменту АВОК 5.2-2012 (приложение Б, таблица Б.1, справочное): ванная - 50, санузел - 25, совмещённый санузел - 75 м³/ч. В СП 54.13330.2022 ванная, душевая и совмещённый санузел - одна строка, 50 м³/ч. Документ АВОК полностью не читал (видел фрагмент).","istochniki":["http://ventstar.com.ua/uploads/files/normativ/abok_5_2_2012.pdf","https://meganorm.ru/mega_doc/norm_update_29032025/nomenklatura/0/sp_54_13330_2022_svod_pravil_zdaniya_zhilye_mnogokvartirnye.html"],"reshenie":"Использовать 50 м³/ч (СП 54 табл. 7.1); 75 - не норма СП."},{"id":"sp54_vs_gostr_zakr_kamera","tema":"Помещение с газовым теплогенератором, закрытая камера сгорания","opisanie":"СП 54.13330.2022 табл. 7.1: 1,0 (кратность, по общему объёму - сноски <*>, <**>). ГОСТ Р 70824-2023 табл. А.1: не менее 60 м³/ч (плюс «в соответствии с ТД предприятий-изготовителей»). Открытая камера сгорания: 100 м³/ч в обоих.","istochniki":["https://meganorm.ru/mega_doc/norm_update_29032025/nomenklatura/0/sp_54_13330_2022_svod_pravil_zdaniya_zhilye_mnogokvartirnye.html","https://www.sweephelp.ru/norms/gost-70824-2023"],"reshenie":"Не использовано в основной таблице (тип не входит в 10 выбранных); при необходимости - брать более жёсткое и проверять СП 402.1325800."},{"id":"skorosti_sp60_vs_gostr","tema":"Рекомендуемые скорости в воздуховодах жилья: СП 60 (Изм. №3) и ГОСТ Р 70824-2023 различаются","opisanie":"СП 60, табл. Л.1: 1,5-2,5 (в помещениях) / 2,5-3,5 (вне помещений) / 4,0-5,0 (в шахтах); табл. Л.3: спутник 1,0-1,5, сборный канал 1,5-2,0, шахта до 1,5. ГОСТ Р 70824, табл. В.1: в квартире 1,5-2,0; в межквартирных коридорах 2,0-3,0; в шахтах 2,0-4,0; спутник 1,0-1,5; сборный канал 2,0-2,5; шахта чердака до 1,0. Оба документа называют значения «рекомендуемыми».","istochniki":["https://meganorm.ru/mega_doc/dop_fire_update_26042025/reshenie_orlovskogo_ufas_rossii_ot_26_03_2025_N_057_06/0/sp_60_13330_2020_svod_pravil_otoplenie_ventilyatsiya_i.html","https://www.sweephelp.ru/norms/gost-70824-2023"],"reshenie":"Оба документа называют значения рекомендуемыми; выбор - за проектировщиком/заданием. Пересечение диапазонов для воздуховодов в квартире - 1,5-2,0 м/с (это моё пересечение, не цитата документа)."},{"id":"sp60_staraya_L","tema":"Устаревшее приложение Л СП 60.13330.2020 встречается в копиях","opisanie":"До Изм. №3 (01.07.2024) приложение Л содержало таблицы скоростей для ОБЩЕСТВЕННЫХ зданий по производительности и часам работы, без жилья. Оно ещё показано на открытой странице Гарант и в версии КонсультантПлюс от 09.08.2022. Действующее приложение Л (Изм. №3) - таблицы Л.1-Л.4 (жилые/общественные/производственные).","istochniki":["https://base.garant.ru/400536193/046ca89c954ee351d44ec9f8ce6babd3/","https://meganorm.ru/mega_doc/dop_fire_update_26042025/reshenie_orlovskogo_ufas_rossii_ot_26_03_2025_N_057_06/0/sp_60_13330_2020_svod_pravil_otoplenie_ventilyatsiya_i.html"],"reshenie":"Использовать приложение Л в редакции Изм. №3."},{"id":"sp54_kuhnya_nisha_vent","tema":"Кухня-ниша: определение допускает естественную вентиляцию, п. 9.11 требует механическую вытяжку","opisanie":"СП 54.13330.2022 п. 3.1.17: «приточно-вытяжной вентиляцией с механическим или естественным побуждением»; п. 9.11: «следует предусматривать устройство механической вытяжной вентиляции в здании».","istochniki":["https://meganorm.ru/mega_doc/norm_update_29032025/nomenklatura/0/sp_54_13330_2022_svod_pravil_zdaniya_zhilye_mnogokvartirnye.html"],"reshenie":"Для модели: механическая вытяжка (п. 9.11 - более жёсткое требование)."},{"id":"sp54_vysota_podrayon","tema":"Высота 2,7 м: климатические подрайоны IА, IБ, IГ, IД и IVА (2022) вместо IIА (2016)","opisanie":"СП 54.13330.2016 п. 5.8 называл IIА; СП 54.13330.2022 п. 5.12 - IVА (подтверждено двумя копиями текста 2022 г.: Меганорм и pereplan.net).","istochniki":["https://meganorm.ru/mega_doc/norm_update_29032025/nomenklatura/0/sp_54_13330_2022_svod_pravil_zdaniya_zhilye_mnogokvartirnye.html","https://pereplan.net/instrukciya/sp-54-13330-2022/"],"reshenie":"Брать 2022 г.; для большинства регионов - 2,5 м."},{"id":"shum_35_25","tema":"«35/25 дБА» в жилых комнатах","opisanie":"Часто встречается в блогах как «норма СП 51 для жилых комнат». В самом СП 51 (табл. 1, поз. 9) значения 40 дБА (день) и 30 дБА (ночь); 35/25 получаются только для шума от вентиляции и другого инженерного оборудования здания по примечанию 3 (минус 5 дБ).","istochniki":["https://meganorm.ru/mega_doc/norm/pravila/0/sp_51_13330_2011_svod_pravil_zashchita_ot_shuma.html","https://sudact.ru/law/postanovlenie-glavnogo-gosudarstvennogo-sanitarnogo-vracha-rf-ot_1430/sanpin-1.2.3685-21/v/gigienicheskie-normativy-fizicheskikh-faktorov-v/tablitsa-5.35/"],"reshenie":"Для шума систем ОВ в жилых комнатах: 35 дБА день / 25 дБА ночь (расчёт по прим. 3), для внешнего шума - 40/30."},{"id":"alasca_i_blogi","tema":"Ненадёжные вторичные источники","opisanie":"Статья alasca.ru «СП 60.13330.2020 простыми словами» утверждает, что приложение К - таблица кратностей (в СП 60 приложение К - «Металлические воздуховоды»). Материал inner.su о скоростях в решётках - без ссылок на документы. Ответ ИИ-поиска «0,2-0,3 м/с для решёток по СП 60» - неверно (0,15-0,3 м/с - это ГОСТ 30494 для обслуживаемой зоны, не для решёток).","istochniki":["https://alasca.ru/novosti/sp-60-13330-2020-prostymi-slovami/","https://inner.su/articles/tablitsa-skorostey-vozdukha-v-vozdukhovodakh-magistrali-reshetki-normy-2025/"],"reshenie":"Не использовать."},{"id":"sp54_tabl_7_1_edinicy","tema":"Таблица 7.1 СП 54.13330.2022: направление и единицы в строках","opisanie":"Столбец называется «Значение воздухообмена»: слов «приток»/«вытяжка» в таблице нет; единицы «1/ч» у мусоросборной камеры и теплогенератора с закрытой камерой (значения «1,0») не указаны. Направление для кухонь, уборных, ванных, совмещённых санузлов взято из п. 9.11, для мусоросборной камеры - из п. 7.32; для кладовой и постирочной в тексте не подтверждено (флаг napravlenie_podtverzhdeno=false).","istochniki":["https://meganorm.ru/mega_doc/norm_update_29032025/nomenklatura/0/sp_54_13330_2022_svod_pravil_zdaniya_zhilye_mnogokvartirnye.html"],"reshenie":"Кладовую (0,2 1/ч) и постирочную (25 м³/ч) в модели помечать как «направление уточнить»."}],"ne_proverennoe":["Первичные страницы docs.cntd.ru, consultant.ru и PDF на minstroyrf.gov.ru из среды выполнения не открылись (прокси/таймаут). Тексты читал на meganorm.ru (сводные редакции), base.garant.ru (открытая часть), tiflocentre.ru, pereplan.net, sweephelp.ru, ng-expertiza.ru (PDF через читалку), карточки статусов - protect.gost.ru (Росстандарт, прочитаны 29.09.2026). Официальные PDF Минстроя не сличал.","Текст Изм. №3 (СП 60) сверен по двум копиям (Меганорм и ovik.miraheze.org); тексты Изм. №5 и №6 - только по транскрипциям на aeropro.wiki (и пересказу buildingclub.ru, c-o-k.ru).","Число проживающих в квартире: нормативного правила нет (проверены СП 54, СП 60, ГОСТ Р 70824); принимается по заданию.","СП 402.1325800.2018 (кухня-столовая с газовой плитой, помещения с газовым теплогенератором) - не открывался.","СП 118.13330.2022 (встроенные общественные помещения, в т.ч. возможные нормы для помещений уборочного инвентаря): не открывался; в СП 54/СП 60 числовой нормы для кладовой уборочного инвентаря и МОП нет.","Скорость в комнатных решётках жилья: числовой нормы в СП нет; справочные значения (Староверов, АВОК) не подтверждены по печатному тексту - в таблицу не внесены. Единственная найденная цифра (0,3 м/с в переточных решётках) - из ТР АВОК 4-2004, вторичный источник 2004 г.","СанПиН 1.2.3685-21: актуальность на 29.09.2026 и срок действия не проверял (использован только для сверки шума).","ГОСТ 30494-2011, таблица 4 (классы качества воздуха, CO2, м³/ч на человека): в доступной копии единицы/столбец не отобразились - цифры не использованы.","СП 51.13330.2011, таблица 1, примечание 7 («в период 7.00-23.00 допустимо превышение … на 5 дБ по СанПиН 2.1.3684»): область применения не выяснена, в таблицу не вносил.","Кладовые, постирочные - направление воздухообмена в таблице 7.1 не указано (см. расхождения).","Изм. №1 и №2 к СП 54: полные тексты Изм. №1 (Контур.Норматив) и перечень пунктов Изм. №2 (Контур.Норматив) прочитаны; влияния на таблицу 7.1 и пп. 5.2, 5.11, 5.12 нет."]};

бренды (Вентс и др.) не использовались.","PDF Арктос устроены так, что текст из них не извлекается (кодировка шрифтов); числа таблиц считаны с отрендеренных страниц (увеличение, визуально). Строки АМР дополнительно сверены программно с текстовым PDF Рэдвент (та же таблица — совпали); таблица ДПУ-М и поправки КВК сверены только визуально — рекомендуется выборочная проверка по оригиналам.","Рэдвент (РЭД-Р1/Р2) и Арктос (АМН/АМР) дают ОДИНАКОВЫЕ аэродинамические таблицы — не считать их двумя независимыми источниками.","У решёток Арктос расход привязан к уровню шума и потерям давления: rashod_min — расход при Lw<20 дБ(А) и ΔP≤1 Па, rashod_max — при Lw=45 дБ(А). Для типовых расходов квартиры (25–150 м³/ч) рабочая область — первые колонки таблицы; у АМР с регулятором потери растут в K раз (1,2/3,7/7,3 при 100/50/30 % открытия), шум — на 2/15/30 дБ(А).","ВКР (Завод «ВЕНТИЛЯТОР»): на сайте в заголовке колонки расхода стоит «м³/с», но числа — в тыс. м³/ч (0,71–1,5 у №5 = 710–1500 м³/ч; подтверждено текстом «Производительность ВКР-5 от 710 м³/ч до 3700 м³/ч»). Единой номинальной точки нет — только рабочая зона (Q_min…Q_max; P от P_max до 0). Линейная интерполяция P(Q) между (Q_min, P_max) и (Q_max, 0) — грубая оценка, реальная кривая — график в каталоге.","Напряжение у ВКР Завода «ВЕНТИЛЯТОР» не указано на страницах; у ВКР Ровен (rowen.ru, каталог ВКР №3,15–6,3, PDF от 10.10.2024) в обозначении «…/380-У1» и схема подключения в сеть 380 В; у ВЕЗА КРОВ по каталогу — 380 В прямой пуск. Для ВКР Завода «ВЕНТИЛЯТОР» 380 В — предположение, не факт: подтвердить у производителя перед выдачей задания электрикам.","ВЕЗА КРОВ: каталог 2014 года (возможны изменения линейки); Q–P только графики. Ровен ВКР (rowen.ru, 4 типоразмера 3,15/4,0/5,0/6,3) в таблицы не включён: кВт/ток/масса есть в PDF https://rowen.ru/upload/iblock/5ff/6mapu8rf5z1ggh2ghabvr0r4e41rureb.pdf, но Q–P — графики; место производства ГК РОВЕН не проверено.","Air-Box: расход «до X м³/ч при ΔP=10 Па» зависит от ширины притвора окна; уровень шума в дБ(А) на сайте не приводится.","Vakio KIV: на сайте модель New называется «VAKIO KIV COMFORT»; «до 60 м³/ч» на странице против 58 м³/ч при 20 Па в паспорте (версия 12.01.2024) — брать паспортное значение. Город производства — Новосибирск по формулировке «разрабатываем и производим… в Новосибирске», адрес цеха не указан.","Не включены: сайты Airone (airone.ru) и Shuft (shuft.ru) недоступны из среды сбора (ответ 403/блокировка), поэтому Airone КИВ-125 и данные Shuft по первоисточнику не проверены; kiv-125.ru (ООО «Эколайн»/«АльянсМ») — магазин с расходом «30–50 м³/ч» без ΔP и без места производства — не принят; era-profi.ru — сайт обувной фабрики, к вентиляции не относится.","ERA Group: у KP KIV, KIV125 и решёток РРП нет таблиц расхода (только размеры, К живого сечения); дроссель-клапан TTV — только геометрия. Зато у ERA есть собственные Revit-семейства (KP KIV D125, KIV 125, РРП, ERF).","Revit: у Арктос семейства выдаются по форме/паролю на https://arktoscomfort.ru/revit-for-arktos/ (АМН/АМР/ДПУ-М/КВК в перечне); на bimlib.pro — Vakio KIV New и PRO, ERA KP KIV D125, ВЕЗА КРОВ. Для ВКР Завода «ВЕНТИЛЯТОР», Air-Box, Рэдвент РЭД-Р1 семейств не найдено.","Цены в источниках (Завод «ВЕНТИЛЯТОР», Ровен, Vakio) в каталог не вносились: не верифицировались на 29.09.2026."]};

<script>/* src/shell.js */
/* Оболочка «окно Revit»: заголовок, лента, строка параметров, палитры,
   панель вида, строка состояния, масштаб сцены, подсказки. */
(function () {
  'use strict';
  var OV = window.OV = window.OV || {};
  var $ = function (id) { return document.getElementById(id); };
  var ik = function (n, r) { return OV.ikona(n, r); };

  /* ---------- общие утилиты ---------- */
  OV.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  };
  OV.chislo = function (v, n) {
    if (v == null || isNaN(v)) return '';
    var s = Number(v).toFixed(n == null ? 1 : n);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return parts.join(',');
  };
  /* значение или метка {{…}} */
  OV.ph = function (v, metka, fmt) {
    if (v == null || v === '') return '<span class="ph" title="Подставит расчётный модуль">{{' + OV.esc(metka || '…') + '}}</span>';
    return fmt ? fmt(v) : OV.esc(v);
  };
  /* текст с метками {{…}} и [[…]] */
  OV.tekst = function (s, znach) {
    var e = OV.esc(s);
    e = e.replace(/\[\[(\w+)\]\]/g, function (m, k) { return znach && znach[k] != null ? OV.esc(znach[k]) : m; });
    return e.replace(/\{\{([^}]*)\}\}/g, function (m, k) {
      var z = window.Engine && Engine.podpis ? Engine.podpis(k, OV.sost) : null;
      return z != null ? OV.esc(z) : '<span class="ph" title="Подставит расчётный модуль">{{' + k + '}}</span>';
    });
  };
  /* следующий кадр анимации; во вкладке в фоне rAF стоит — тогда таймер */
  OV.kadr = function (fn) {
    if (document.hidden) return setTimeout(fn, 16);
    return requestAnimationFrame(function () { fn(); });
  };
  OV.vremya = function () {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  };

  var sh = OV.obolochka = {};
  sh.vkladka = 'sist';
  sh.masshtab = 1;

  /* ---------- масштаб сцены ---------- */
  sh.podognat = function (ms) {
    var rz = OV.kamera.rezhim();
    var b = document.body.classList;
    b.toggle('mobil', rz.mobil); b.toggle('portret', rz.portret); b.toggle('vneshn', rz.vneshnyaya);
    var niz = $('nizStranicy'), nh = niz ? niz.offsetHeight : 30;
    document.documentElement.style.setProperty('--niz-h', nh + 'px');
    var uz = $('uzkiy');
    var podsk = rz.mobil && rz.portret && !sh.uzkiyZakryt;
    if (podsk && !sh.uzkiyTaymer) sh.uzkiyTaymer = setTimeout(function () { sh.uzkiyZakryt = true; sh.podognat(300); }, 9000);
    if (uz) uz.classList.toggle('vid', podsk);
    b.toggle('est-podskazka', podsk);
    if (OV.shtorka) OV.shtorka.raskladka(rz);
    OV.kamera.pereschet(ms || 0);
  };
  /* прямоугольник элемента в координатах сцены 1600×900 */
  sh.pryam = function (el) {
    if (!el) return null;
    var r = el.getBoundingClientRect(), st = $('stsena').getBoundingClientRect(), s = sh.masshtab;
    return { x: (r.left - st.left) / s, y: (r.top - st.top) / s, w: r.width / s, h: r.height / s };
  };

  /* ---------- строка заголовка ---------- */
  function zagolovok() {
    var q = function (n, t, dd) { return '<span class="qb" title="' + t + '">' + ik(n, 16) + (dd ? '<span class="str">▾</span>' : '') + '</span>'; };
    var winBtn = '<div class="okno-kn">' +
      '<span title="Свернуть"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5.5h10" stroke="#333"/></svg></span>' +
      '<span title="Свернуть в окно"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2.5 .5h7v7M.5 2.5h7v7h-7z" fill="none" stroke="#333"/></svg></span>' +
      '<span class="x" title="Закрыть"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10" stroke="#333"/></svg></span></div>';
    $('rvZag').innerHTML =
      '<div class="app" title="Revit">R</div>' +
      '<div class="bdd">' + q('open', 'Открыть') + q('save', 'Сохранить') + '<span class="sep"></span>' +
      q('undo', 'Отменить', true) + q('redo', 'Повторить', true) + '<span class="sep"></span>' +
      q('print', 'Печать') + q('measure', 'Измерить', true) + q('view3d', '3D-вид по умолчанию', true) + q('section', 'Разрез') +
      q('thinLines', 'Тонкие линии') + q('closeWin', 'Закрыть неактивные окна') +
      '<span class="qb" title="Настроить панель быстрого доступа"><span class="str" style="font-size:9px">▾</span></span></div>' +
      '<div class="titul" id="titul">Жилой дом_корпус 2_ОВ.rvt — План этажа: 3 этаж — Вентиляция</div>' +
      '<div class="poisk">' + ik('search', 14) + '<span>Введите ключевое слово или фразу</span></div>' +
      '<div class="pr-ikony"><span class="qb" title="Вход">' + ik('user', 16) + '<span>Войти</span><span style="font-size:8px">▾</span></span>' +
      '<span class="qb" title="Справка">' + ik('help', 16) + '<span style="font-size:8px">▾</span></span></div>' + winBtn;
  }

  /* ---------- вкладки и лента ---------- */
  function vkladki() {
    var h = OV.lenta.map(function (v) {
      var cls = 'vk' + (v.fail ? ' fail' : '') + (v.nash ? ' nash' : '') + (v.id === sh.vkladka ? ' akt' : '');
      return '<div class="' + cls + '" data-vk="' + v.id + '" data-demo-id="vkladka-' + v.id + '">' + OV.esc(v.t) + '</div>';
    }).join('');
    h += '<div class="vk kontekst" id="vkKontekst" style="display:none"></div>';
    $('rvVkladki').innerHTML = h;
  }

  /* подпись крупной кнопки — не больше двух строк, как в Revit */
  var GLASN = 'аеёиоуыэюя';
  function perenos(t) {
    if (t.indexOf('|') >= 0) return t.split('|');
    var m = t.match(/^(\S{4,}-)(\S{4,})$/);
    if (m && t.length > 11) return [m[1], m[2]];
    var sl = t.replace(/\/\s/g, '/ ').split(' ');
    if (sl.length > 1) {
      var luch = null;
      for (var i = 1; i < sl.length; i++) {
        var a = sl.slice(0, i).join(' '), b = sl.slice(i).join(' ');
        var d = Math.max(a.length, b.length);
        if (!luch || d < luch.d) luch = { d: d, s: [a, b] };
      }
      return luch.s;
    }
    if (t.length > 11) {
      var c = Math.ceil(t.length / 2);
      for (var k = 0; k < 4; k++) {
        if (GLASN.indexOf(t.charAt(c + k - 1).toLowerCase()) >= 0 && GLASN.indexOf(t.charAt(c + k).toLowerCase()) < 0) { c = c + k; break; }
        if (GLASN.indexOf(t.charAt(c - k - 1).toLowerCase()) >= 0 && GLASN.indexOf(t.charAt(c - k).toLowerCase()) < 0) { c = c - k; break; }
      }
      return [t.slice(0, c) + '-', t.slice(c)];
    }
    return [t];
  }

  function knopkaHtml(it, nash) {
    var cmd = it.cmd ? ' data-cmd="' + it.cmd + '" data-demo-id="knopka-' + it.cmd + '"' : '';
    var cls = nash ? ' nash-k' : '';
    if (it.L) {
      return '<div class="kb kb-L' + cls + '"' + cmd + ' data-t="' + OV.esc(it.t) + '">' + ik(it.L, 32) +
        '<div class="pd">' + perenos(it.t).map(OV.esc).join('<br>') + '</div>' + (it.dd ? '<div class="str">▾</div>' : '') + '</div>';
    }
    if (it.S) {
      return '<div class="stopka">' + it.S.map(function (s) {
        var c2 = s.cmd ? ' data-cmd="' + s.cmd + '" data-demo-id="knopka-' + s.cmd + '"' : '';
        return '<div class="kb kb-S' + cls + '"' + c2 + ' data-t="' + OV.esc(s.t) + '">' + ik(s.i, 16) + '<span>' + OV.esc(s.t) + '</span>' + (s.dd ? '<span class="str">▾</span>' : '') + '</div>';
      }).join('') + '</div>';
    }
    return '';
  }

  function lenta() {
    var v = OV.lenta.filter(function (x) { return x.id === sh.vkladka; })[0];
    if (!v || !v.panels) return;
    $('rvLenta').innerHTML = '<div class="lenta-soderzh" data-lenta="' + v.id + '">' + v.panels.map(function (p) {
      return '<div class="pn' + (v.nash ? ' nash' : '') + '" data-pn="' + OV.esc(p.t) + '"><div class="pn-tel">' + p.items.map(function (it) { return knopkaHtml(it, v.nash); }).join('') +
        '</div><div class="pn-zag">' + OV.esc(p.t) + (p.dd ? '<span class="dd">▾</span>' : '') + (p.zapusk ? '<span class="zap"></span>' : '') + '</div></div>';
    }).join('') + '</div>';
  }

  /* если панели не помещаются — сворачиваем правые, как Revit на узком окне */
  function svernutPaneli() {
    var box = $('rvLenta'), sod = box.querySelector('.lenta-soderzh');
    if (!sod) return;
    var pns = sod.querySelectorAll('.pn');
    for (var i = pns.length - 1; i >= 1 && sod.scrollWidth > box.clientWidth - 4; i--) {
      var pn = pns[i];
      var ico = pn.querySelector('.ic');
      var t = pn.getAttribute('data-pn');
      pn.querySelector('.pn-tel').innerHTML = '<div class="kb kb-L" data-t="' + OV.esc(t) + '">' + (ico ? ico.outerHTML : '') + '<div class="pd">' + perenos(t).map(OV.esc).join('<br>') + '</div><div class="str">▾</div></div>';
      pn.querySelector('.pn-zag').innerHTML = '';
      pn.classList.add('svernuta');
    }
  }

  sh.pokazatVkladku = function (id) {
    var v = OV.lenta.filter(function (x) { return x.id === id; })[0];
    if (!v) return;
    if (v.fail) { sh.status('Меню «Файл» в демонстрации не открывается.'); return; }
    if (sh.vkladka === id) return;
    sh.vkladka = id;
    Array.prototype.forEach.call(document.querySelectorAll('.vk[data-vk]'), function (e) { e.classList.toggle('akt', e.getAttribute('data-vk') === id); });
    lenta(); svernutPaneli();
  };
  sh.knopka = function (cmd) { return document.querySelector('.kb[data-cmd="' + cmd + '"]'); };
  sh.elVkladki = function (id) { return document.querySelector('.vk[data-vk="' + id + '"]'); };
  sh.migatVkladkoy = function (id) {
    var e = sh.elVkladki(id); if (!e) return;
    e.classList.remove('poyavl'); void e.offsetWidth; e.classList.add('poyavl');
  };
  /* имитация нажатия кнопки (для экскурсии) */
  sh.nazhat = function (cmd) {
    var k = sh.knopka(cmd); if (!k) return;
    k.classList.add('nazh');
    setTimeout(function () { k.classList.remove('nazh'); }, 260);
  };

  /* контекстная вкладка «Изменить | …» */
  sh.kontekst = function (tekst) {
    var e = $('vkKontekst'); if (!e) return;
    if (tekst) { e.textContent = 'Изменить | ' + tekst; e.style.display = ''; }
    else e.style.display = 'none';
  };

  /* ---------- подсказки ленты ---------- */
  var tipTaymer = null, tipEl = null;
  function pokazatPodskazku(k) {
    var p = $('podskazka');
    var cmd = k.getAttribute('data-cmd');
    var t = k.getAttribute('data-t');
    var html;
    if (cmd && OV.podskazki[cmd]) {
      html = '<b>' + OV.esc(OV.podskazki[cmd][0]) + '</b>' + OV.esc(OV.podskazki[cmd][1]) +
        '<div class="niz">' + ik('ovPult', 16) + 'Надстройка «Пульт ОВиК» · нажмите F1 для справки</div>';
    } else {
      html = '<b>' + OV.esc(t) + '</b><span style="color:#666">Нажмите F1 для получения дополнительной справки</span>';
    }
    p.innerHTML = html;
    var r = sh.pryam(k);
    var x = Math.min(r.x, 1600 - 330), y = r.y + r.h + 6;
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.classList.add('vid');
  }
  function skrytPodskazku() { clearTimeout(tipTaymer); tipEl = null; $('podskazka').classList.remove('vid'); }
  sh.skrytPodskazku = skrytPodskazku;

  /* ---------- строка параметров ---------- */
  sh.obnovitParametry = function () {
    var v = OV.sost && OV.sost.vybor;
    var h = '<div class="izm">' + ik('modify', 16) + '<span>Изменить</span></div>';
    if (v && v.vid === 'pom') h = '<div class="izm">' + ik('modify', 16) + '<span>Изменить | Пространства</span></div><div class="pole"><span class="chk"></span>Внутренние границы</div>';
    else if (v && v.vid === 'resh') h = '<div class="izm">' + ik('modify', 16) + '<span>Изменить | Воздухораспределители</span></div><div class="pole">Уровень: <span class="sel">3 этаж</span></div><div class="pole">Смещение: <span class="sel" style="min-width:70px">2650,0</span></div>';
    else if (v && v.vid === 'vd') h = '<div class="izm">' + ik('modify', 16) + '<span>Изменить | Воздуховоды</span></div><div class="pole">Диаметр: <span class="sel" style="min-width:60px">' + OV.esc(OV.model.vd(v.id).razmer.replace('Ø', '')) + '</span></div><div class="pole">Смещение: <span class="sel" style="min-width:70px">2800,0 мм</span></div>';
    $('rvParametry').innerHTML = h;
  };

  /* ---------- палитра «Свойства» ---------- */
  function strokaSv(k, z, opts) {
    opts = opts || {};
    return '<div class="sv-str' + (opts.nash ? ' nash' : '') + (opts.obnov ? ' obnov' : '') + '"><div class="k" title="' + OV.esc(k) + '">' + OV.esc(k) + '</div><div class="z' + (opts.tusk ? ' tusk' : '') + '">' + z + '</div></div>';
  }
  function gruppa(t, stroki) { return '<div class="sv-gr"><span class="tg">▾</span>' + OV.esc(t) + '</div>' + stroki.join(''); }
  var btnz = function (t) { return '<span class="btnz">' + t + '</span>'; };
  var chk = '<span class="chk"></span>';

  /* вентилятор системы (из «Характеристики систем»; если её ещё не строили — считаем тем же модулем) */
  function ventilyatorSistemy(sisId) {
    var s = OV.sost;
    if (!s.rezultat || !window.Engine || !Engine.obschieDannye || Engine.zaglushka) return null;
    var od = s.obschie;
    if (!od) { try { od = Engine.obschieDannye(OV.E, s.rezultat, s.reshetki, OV.OBORUDOVANIE, { etazhnost: OV.E.etazh.etazhnost, unifikaciya: s.nastroyki.unifikaciya !== false }); } catch (e) { return null; } }
    return (od.stroki || []).filter(function (r) { return r.oboznachenie === sisId; })[0] || null;
  }
  function strokiVentilyatora(sisId) {
    var r = ventilyatorSistemy(sisId);
    if (!r) return [strokaSv('ОВиК_Вентилятор системы', '', { nash: 1, tusk: 1 })];
    return [strokaSv('ОВиК_Вентилятор системы', r.prichina ? '<span title="' + OV.esc(r.ustanovka + ', ' + r.n + ' об/мин, ' + r.N + ' кВт') + '">' + OV.esc(String(r.ustanovka).replace(/, Завод.*$/, '') + ' · ' + r.N + ' кВт · ' + r.n + ' об/мин') + '</span>' : OV.esc(r.ustanovka || '—'), { nash: 1 }),
      strokaSv('ОВиК_Почему этот', r.prichina ? '<span title="' + OV.esc(r.prichina) + '">' + OV.esc(r.prichina) + '</span>' : '—', { nash: 1 })];
  }
  sh.obnovitSvoystva = function (podsvetit) {
    var s = OV.sost, v = s.vybor, m = OV.model;
    var tip, filtr, setka;
    var ob = !!podsvetit;
    if (v && v.vid === 'pom') {
      var p = m.pom(v.id);
      var t = m.tipPom(v.id);
      var r = m.rezPom(v.id);
      var kv = p.kvartira ? m.kv(p.kvartira) : null;
      tip = { ico: 'space', n1: 'Пространство', n2: '' };
      filtr = 'Пространства (1)';
      setka = gruppa('Зависимости', [strokaSv('Уровень', '3 этаж'), strokaSv('Верхний предел', '3 этаж'), strokaSv('Смещение предела', '2700,0'), strokaSv('Смещение снизу', '0,0')]) +
        gruppa('Механизмы — потоки воздуха', [
          strokaSv('Расчётный приток', r ? OV.ph(r.trebuemyPritok, 'L', function (x) { return OV.chislo(x, 0) + ' м³/ч'; }) : '', { tusk: !r, obnov: ob && r }),
          strokaSv('Расчётная вытяжка', r ? OV.ph(r.trebuemayaVytyazhka, 'L', function (x) { return OV.chislo(x, 0) + ' м³/ч'; }) : '', { tusk: !r, obnov: ob && r }),
          strokaSv('Заданный расход приточного воздуха', '0,0 м³/ч'), strokaSv('Заданный расход вытяжного воздуха', '0,0 м³/ч')]) +
        gruppa('Размеры', [strokaSv('Площадь', OV.chislo(m.ploschad(v.id), 2) + ' м²'), strokaSv('Периметр', OV.chislo(m.perimetr(v.id) * 1000, 1)),
          strokaSv('Неограниченная высота', '2700,0'), strokaSv('Объём', OV.chislo(m.obem(v.id), 2) + ' м³')]) +
        gruppa('Идентификация', [strokaSv('Номер', OV.esc(p.id)), strokaSv('Имя', OV.esc(p.imya)), strokaSv('Комментарии', ''), strokaSv('ADSK_Номер квартиры', kv ? OV.esc(kv.id) : '')]) +
        gruppa('Пульт ОВиК', [
          strokaSv('ОВиК_Тип помещения', t ? OV.esc(m.imyaTipa(t.tipId) || 'не задан') + (t.vruchnuyu ? ' (вручную)' : '') : '', { nash: 1, tusk: !t, obnov: ob && t }),
          strokaSv('ОВиК_Правило', r ? (r.pravilo ? '<span title="' + OV.esc(r.formula || r.pravilo) + '">' + OV.esc(r.pravilo) + '</span>' : (r.tipId ? '—' : OV.ph(null, 'правило'))) : '', { nash: 1, tusk: !r, obnov: ob && r }),
          strokaSv('ОВиК_Пункт нормы', r ? (r.punkt ? '<span title="' + OV.esc((r.dokument ? r.dokument + ', ' : '') + r.punkt) + '">' + OV.esc((r.dokument ? r.dokument + ', ' : '') + r.punkt) + '</span>' : (r.tipId ? '—' : OV.ph(null, 'документ, пункт'))) : '', { nash: 1, tusk: !r, obnov: ob && r }),
          strokaSv('ОВиК_Статус нормы', r && r.statusTekst ? '<span title="' + OV.esc(r.statusTekst + (r.zametka ? '. ' + r.zametka : '')) + '">' + OV.esc(r.statusTekst) + '</span>' : '', { nash: 1, tusk: !r })].concat((function () {
            var kl = kv && m.klapanyKvartir ? (m.klapanyKvartir() || []).filter(function (x) { return x.kvartira === kv.id; })[0] : null;
            if (!kl) return [];
            return [strokaSv('ОВиК_Клапаны квартиры', '<span title="' + OV.esc(kl.istochnik + '. ' + kl.zametka) + '"' + (kl.hvataet === false ? ' style="color:#d13438;font-weight:600"' : '') + '>' + kl.kolvo + ' × ' + OV.chislo(kl.naKlapan, 0) + ' = ' + OV.chislo(kl.summa, 0) + ' из ' + OV.chislo(kl.trebuetsya, 0) + ' м³/ч</span>', { nash: 1, obnov: ob })];
          })())) +
        gruppa('Стадии', [strokaSv('Стадия', 'Новая конструкция')]);
    } else if (v && v.vid === 'resh') {
      var rs = m.resh(v.id), rr = m.rezResh(v.id), pom = m.pom(rs.pomeschenie);
      var razm = m.razmerResh(v.id);
      var wh = /\{\{/.test(razm) ? [null, null] : String(razm || '').split('×');
      tip = { ico: 'airTerm', n1: 'Решётка вытяжная', n2: /\{\{/.test(razm) ? 'тип подберёт модуль' : (razm || '—') };
      filtr = 'Воздухораспределители (1)';
      setka = gruppa('Зависимости', [strokaSv('Уровень', '3 этаж'), strokaSv('Смещение', '2650,0'), strokaSv('Основа', 'Уровень : 3 этаж')]) +
        gruppa('Механизмы', [strokaSv('Классификация системы', 'Вытяжной воздух'), strokaSv('Тип системы', 'В_Вытяжная'), strokaSv('Имя системы', OV.esc(rs.sistema)),
          strokaSv('Расход', rr ? (rr.rashod != null ? OV.chislo(rr.rashod, 0) + ' м³/ч' : (rr.prichina ? 'задать (нормы нет)' : OV.ph(null, 'L'))) : '—', { tusk: !rr, obnov: ob && rr }),
          strokaSv('Шум / потери (каталог)', rr && rr.shumModeli ? '<span title="' + OV.esc(rr.shumModeli.tekst) + '">' + OV.esc(rr.shumModeli.tekst) + '</span>' : '—', { tusk: !rr })]) +
        gruppa('Размеры', [strokaSv('Ширина', OV.ph(wh[0], 'ширина')), strokaSv('Высота', OV.ph(wh[1], 'высота'))]) +

  sh.pultViden = true;

    setTimeout(function () { OV.plan && OV.plan.razmer(); }, 280);

  /* ---------- сборка и события ---------- */
  sh.init = function () {
    zagolovok(); vkladki(); lenta(); svernutPaneli(); sh.obnovitParametry(); sh.obnovitSvoystva(); dispetcher(); vid(); statusStroka();

    $('uzkiyZakryt').addEventListener('click', function () { sh.uzkiyZakryt = true; $('uzkiy').classList.remove('vid'); document.body.classList.remove('est-podskazka'); OV.kamera.pereschet(300); });

    var lentaEl = $('rvLenta');

<script>/* src/camera.js */
/* «Камера»: плавное приближение окна Revit (сцена 1600×900) к нужной области.
   Общая для телефона, режима «Ролик» на компьютере и будущей записи MP4.

   focusCamera(cel, {padding, duration, maxS, minS})
     cel — элемент, список элементов или прямоугольник {x, y, w, h} в координатах сцены.
   resetCamera({duration}) — показать окно целиком.

   На телефоне здесь же жесты: перетаскивание одним пальцем, масштаб двумя,
   двойной тап — показать всё; тап по кнопкам с невидимо увеличенной зоной 44 px. */
(function () {
  'use strict';
  var OV = window.OV = window.OV || {};
  var K = OV.kamera = { s: 1, x: 0, y: 0, fokus: null };
  var W = 1600, H = 900;
  var tok = 0;
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- режим экрана ---------- */
  K.rezhim = function () {
    var w = window.innerWidth, h = window.innerHeight;
    var grubo = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    var mobil = w < 900 || (h < 520 && w < 1100) || (grubo && Math.min(w, h) < 600);
    return { mobil: mobil, portret: h > w, vneshnyaya: mobil || !!OV.rolik };
  };

  /* ---------- область, где видна сцена (без шторки) ---------- */
  K.oblast = function () {
    // размеры берём из раскладки (offset*), а не из getBoundingClientRect:
    // шторка во время выезда сдвинута transform'ом, а считать надо конечное положение
    var e = $('ekran');
    var a = { x: 0, y: 0, w: e.clientWidth, h: e.clientHeight };
    var uz = $('uzkiy');
    if (uz && uz.classList.contains('vid')) { var v = uz.offsetTop + uz.offsetHeight + 6; a.y = v; a.h = Math.max(120, a.h - v); }
    var sh = $('shtorka');
    if (sh && sh.classList.contains('vid')) {
      if (sh.classList.contains('bok')) a.w = Math.max(120, a.w - sh.offsetWidth);
      else a.h = Math.max(120, a.h - sh.offsetHeight);
    }
    return a;
  };
  function baza(a) {
    var s = Math.min(a.w / W, a.h / H);
    return { s: s, x: a.x + (a.w - W * s) / 2, y: a.y + (a.h - H * s) / 2 };
  }
  function ogranichit(v, a) {
    var sw = W * v.s, sh = H * v.s;
    v.x = sw <= a.w ? a.x + (a.w - sw) / 2 : Math.min(a.x, Math.max(a.x + a.w - sw, v.x));
    v.y = sh <= a.h ? a.y + (a.h - sh) / 2 : Math.min(a.y, Math.max(a.y + a.h - sh, v.y));
    return v;
  }
  function pryamCeli(cel) {
    if (!cel) return null;
    if (cel.w != null && cel.h != null && cel.x != null) return cel;
    var spisok = (cel.length != null && !cel.getBoundingClientRect) ? Array.prototype.slice.call(cel) : [cel];
    var r = null;
    spisok.forEach(function (el) {
      var q = el && el.w != null ? el : OV.obolochka.pryam(el);
      if (!q || q.w <= 0 || q.h <= 0) return;
      if (!r) r = { x: q.x, y: q.y, w: q.w, h: q.h };
      else { var x2 = Math.max(r.x + r.w, q.x + q.w), y2 = Math.max(r.y + r.h, q.y + q.h); r.x = Math.min(r.x, q.x); r.y = Math.min(r.y, q.y); r.w = x2 - r.x; r.h = y2 - r.y; }
    });
    return r;
  }
  K.pryamCeli = pryamCeli;
  /* прямоугольник элемента с запасом вокруг (в пикселях сцены) */
  K.rasshirit = function (cel, zapas) {
    var r = pryamCeli(cel); if (!r) return null;
    var x1 = Math.max(0, r.x - zapas), y1 = Math.max(0, r.y - zapas), x2 = Math.min(W, r.x + r.w + zapas), y2 = Math.min(H, r.y + r.h + zapas);
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  };
  function celevoy(r, o, a) {
    o = o || {};
    var b = baza(a);

<script>/* src/plan.js */

      }

  /* ---------- марки помещений, систем, воздуховодов (статичны) ---------- */

      gg += '<rect x="' + f(m[0] - 0.36) + '" y="' + f(-(m[1] + 0.17)) + '" width=".72" height=".34" rx=".04" fill="#fff" stroke="' + c + '" stroke-width="1.2"' + NSE + '/>';
      gg += tekst(m[0] - 0.05, m[1] - 0.09, s.sistema, 0.25, '', ' text-anchor="middle" font-weight="600" fill="' + temnee(c, 0.75) + '"');
      gg += '<path d="M' + P(m[0] + 0.22, m[1] - 0.1) + 'L' + P(m[0] + 0.22, m[1] + 0.1) + 'M' + P(m[0] + 0.16, m[1] + 0.03) + 'L' + P(m[0] + 0.22, m[1] + 0.11) + 'L' + P(m[0] + 0.28, m[1] + 0.03) + '" fill="none" stroke="' + temnee(c, 0.75) + '" stroke-width="1"' + NSE + '/>';

  /* ---------- решётки и их марки (зависят от расчёта) ---------- */

      mm += tekst(tx, ty - 0.27, l2, 0.24, '', ' fill="' + (/\{\{/.test(l2) ? '#3b6f95' : cvT) + '"' + (/\{\{/.test(l2) ? ' font-style="italic"' : ''));
